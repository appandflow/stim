<!doctype html><meta charset="utf-8" /><style>
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 412px;
    height: 915px;
    font-family: Roboto, system-ui;
    background: #fffdf5;
    color: #26210f;
    overflow: hidden;
    position: relative;
  }
  .sb {
    height: 34px;
    display: flex;
    justify-content: space-between;
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 500;
  }
  .bar {
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 16px;
    font-size: 22px;
  }
  h1 {
    font-size: 28px;
    padding: 10px 20px;
  }
  .p {
    padding: 6px 20px;
    font-size: 17px;
    line-height: 1.5;
    color: #4a4328;
  }
  .chk {
    padding: 6px 20px;
    font-size: 17px;
    color: #4a4328;
  }
  .chk i {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid #c58a00;
    border-radius: 4px;
    margin-right: 12px;
    vertical-align: -3px;
    font-style: normal;
  }
  .chk .d {
    background: #c58a00;
  }
</style>
<body>
  <div class="sb"><span>4:56</span><span>&#9642;&#9642;&#9642;</span></div>
  <div class="bar">&#8592;</div>
  <h1>Trip packing list</h1>
  <div class="p">Weekend in Lisbon. Check the forecast on Thursday.</div>
  <div class="chk"><i class="d"></i>Passport</div>
  <div class="chk"><i class="d"></i>Phone charger</div>
  <div class="chk"><i class="d"></i>Rain jacket</div>
  <div class="chk"><i></i>Walking shoes</div>
  <div class="chk"><i></i>Sunglasses</div>
  <div class="chk"><i></i>Camera</div>
</body>
