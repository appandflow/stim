<!doctype html><meta charset="utf-8" /><style>
  * {
    box-sizing: border-box;
    margin: 0;
  }
  body {
    width: 412px;
    height: 915px;
    font-family:
      Roboto,
      system-ui,
      -apple-system;
    background: #fbfdf9;
    color: #191c1a;
    overflow: hidden;
    position: relative;
  }
  .sb {
    height: 34px;
    display: flex;
    justify-content: space-between;
    padding: 8px 22px;
    font-size: 14px;
    font-weight: 500;
  }
  .bar {
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 16px;
    font-size: 22px;
  }
  .bar span {
    font-size: 20px;
    font-weight: 500;
  }
  .hero {
    margin: 8px 16px;
    border-radius: 24px;
    background: #c4ecd6;
    padding: 22px;
  }
  .hero .n {
    font-size: 56px;
    font-weight: 600;
    color: #00513a;
  }
  .hero .l {
    font-size: 15px;
    color: #2d5444;
  }
  .row {
    display: flex;
    gap: 6px;
    margin: 16px 16px 6px;
  }
  .d {
    flex: 1;
    text-align: center;
    font-size: 12px;
    color: #5c6660;
  }
  .d b {
    display: block;
    margin: 6px auto 0;
    width: 34px;
    height: 34px;
    border-radius: 17px;
    line-height: 34px;
    background: #e1e8e2;
    color: #191c1a;
    font-weight: 500;
  }
  .d.ok b {
    background: #2f7d5b;
    color: #fff;
  }
  .sec {
    margin: 20px 16px 8px;
    font-size: 14px;
    color: #5c6660;
    font-weight: 500;
  }
  .item {
    margin: 0 16px 8px;
    padding: 16px;
    border-radius: 16px;
    background: #eff5ef;
    font-size: 16px;
    display: flex;
    justify-content: space-between;
  }
  .item small {
    display: block;
    color: #5c6660;
    font-size: 13px;
    margin-top: 3px;
  }
  .fab {
    position: absolute;
    right: 20px;
    bottom: 90px;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: #2f7d5b;
    color: #fff;
    font-size: 30px;
    text-align: center;
    line-height: 54px;
  }
</style>
<body>
  <div class="sb"><span>4:56</span><span>&#9642;&#9642;&#9642;</span></div>
  <div class="bar">&#8592;<span>Drink water</span></div>
  <div class="hero">
    <div class="n">12 days</div>
    <div class="l">Current streak &middot; best 31 days</div>
  </div>
  <div class="row">
    <div class="d ok">M<b>1</b></div>
    <div class="d ok">T<b>2</b></div>
    <div class="d ok">W<b>3</b></div>
    <div class="d ok">T<b>4</b></div>
    <div class="d ok">F<b>5</b></div>
    <div class="d">S<b>6</b></div>
    <div class="d">S<b>7</b></div>
  </div>
  <div class="sec">Today</div>
  <div class="item">
    <div>Morning glass<small>Logged 7:45 AM</small></div>
    <div>&#10003;</div>
  </div>
  <div class="item">
    <div>Lunch<small>Logged 12:30 PM</small></div>
    <div>&#10003;</div>
  </div>
  <div class="item">
    <div>Afternoon<small>Reminder at 3:00 PM</small></div>
    <div>&#9675;</div>
  </div>
  <div class="item">
    <div>Evening<small>Reminder at 7:00 PM</small></div>
    <div>&#9675;</div>
  </div>
  <div class="fab">+</div>
</body>
