gradle.beforeProject { project ->
    ["com.android.application", "com.android.library"].each { plugin ->
        project.pluginManager.withPlugin(plugin) {
            project.extensions.getByName("androidComponents").finalizeDsl { android ->
                def reactApplication = project.plugins.hasPlugin("com.android.application") && project.plugins.hasPlugin("com.facebook.react")
                if (!android.externalNativeBuild.cmake.path && !reactApplication) return
                def expectedNdk = System.getenv("STIM_ANDROID_CAS_NDK_VERSION")
                if (android.ndkVersion && android.ndkVersion != expectedNdk) {
                    throw new GradleException("Stim CAS toolchain requires NDK ${expectedNdk}; ${project.path} selects ${android.ndkVersion}.")
                }
                if (android.ndkPath && new File(android.ndkPath).canonicalPath != new File(System.getenv("STIM_ANDROID_CAS_NDK")).canonicalPath) {
                    throw new GradleException("Stim CAS toolchain does not match ${project.path}'s explicit ndkPath.")
                }
                def configs = [android.defaultConfig] + android.buildTypes.toList() + android.productFlavors.toList()
                if (configs.any { config -> config.externalNativeBuild.cmake.arguments.any { arg ->
                    arg =~ /^(?:-D\s*)?CMAKE_(?:TOOLCHAIN_FILE|PROJECT_INCLUDE)(?::[^=]+)?=/
                } }) {
                    throw new GradleException("Stim CAS prototype cannot replace ${project.path}'s custom CMake toolchain or project hook.")
                }
                android.defaultConfig.externalNativeBuild.cmake.arguments.addAll([
                    "-DCMAKE_TOOLCHAIN_FILE=" + System.getenv("STIM_ANDROID_CAS_CMAKE_TOOLCHAIN"),
                    "-DCMAKE_PROJECT_INCLUDE=" + System.getenv("STIM_ANDROID_CAS_CMAKE_PCH"),
                    "-DSTIM_ANDROID_CAS_STATE=" + System.getenv("STIM_ANDROID_CAS_STATE"),
                    "-DCCACHE_FOUND=OFF"
                ])
            }
        }
    }
}
