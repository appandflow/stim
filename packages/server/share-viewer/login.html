<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Shared app</title>
    <link rel="stylesheet" href="/s/assets/viewer.css" />
  </head>
  <body class="page">
    <header class="bar">{{logo}}</header>
    <main class="center">
      <form class="card" method="post" action="login">
        <h1>Enter the password</h1>
        <p class="hint">The person who shared this app gave you one.</p>
        <input
          type="password"
          name="password"
          autocomplete="off"
          autofocus
          required
          maxlength="128"
          aria-label="Password"
        />
        <p class="error" role="alert">{{message}}</p>
        <button class="primary" type="submit">View app</button>
      </form>
    </main>
    <footer>
      Shared with <a href="https://stim.appandflow.com" target="_blank" rel="noopener noreferrer">Stim</a>
    </footer>
  </body>
</html>
