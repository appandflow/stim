<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15121d" media="(prefers-color-scheme: dark)" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/s/assets/viewer.css" />
  </head>
  <body
    class="viewer"
    data-control="{{control}}"
    data-view-only="{{viewOnly}}"
    data-upgrade="{{upgrade}}"
    data-ask-name="{{askName}}"
    data-platform="{{platform}}"
    data-buttons="{{buttons}}"
    data-can-rotate="{{rotate}}"
    data-webrtc="{{webrtc}}"
    data-stun="{{stun}}"
  >
    <header class="topbar">
      <p class="status" id="status" role="status" data-state="waiting">
        <span class="dot"></span><span class="source"></span><span class="sep">&middot;</span
        ><span id="status-text">Connecting</span>
      </p>
      <span class="spacer"></span>
      <p class="pill" id="left"></p>
      <p class="pill mode"></p>
      <div class="people" id="people" hidden>
        <button
          type="button"
          class="people-button"
          id="people-button"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="people-panel"
        >
          <span class="roster" id="roster" aria-hidden="true"></span>
        </button>
        <div class="people-panel" id="people-panel" role="dialog" aria-label="People" hidden>
          <p class="people-title" id="people-title"></p>
          <ul class="people-list" id="people-list"></ul>
        </div>
      </div>
      <form class="upgrade" id="upgrade" method="post" action="login" hidden>
        <button class="link" id="upgrade-open" type="button">Have the control access code?</button>
        <span class="upgrade-fields" id="upgrade-fields" hidden>
          <input
            class="field secret"
            type="text"
            name="access"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            data-1p-ignore
            data-lpignore="true"
            data-bwignore
            data-form-type="other"
            required
            maxlength="128"
            placeholder="Control access code"
            aria-label="Control access code"
          />
          <button class="primary small" type="submit">Control</button>
        </span>
      </form>
      <span class="rule"></span>
      <div class="options" id="options" hidden>
        <button
          type="button"
          class="iconbtn"
          id="options-button"
          title="Options"
          aria-label="Options"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-controls="options-panel"
        >
          <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h9M17 8h3M4 16h3M11 16h9" />
            <circle cx="15" cy="8" r="2" />
            <circle cx="9" cy="16" r="2" />
          </svg>
        </button>
        <div class="options-panel" id="options-panel" role="dialog" aria-label="Options" hidden>
          <label class="switch-row" for="sync-clipboard">
            <span class="switch-label" id="sync-title">Sync clipboard</span>
            <input class="switch" id="sync-clipboard" type="checkbox" role="switch" />
          </label>
          <p class="options-help" id="sync-help">
            Copy text between this browser and the device while this page is focused.
          </p>
          <p class="options-help" id="sync-note" hidden></p>
          <button type="button" class="link" id="paste-device" hidden>Paste to device</button>
          <button type="button" class="link" id="copy-device">Copy from device</button>
          <textarea
            class="copy-fallback"
            id="copy-fallback"
            rows="3"
            readonly
            hidden
            aria-label="Device clipboard text"
          ></textarea>
        </div>
      </div>
      <button type="button" class="iconbtn" id="full" title="Fullscreen" aria-label="Fullscreen">
        <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 10L4 4M4 4h5.5M4 4v5.5M14 14l6 6M20 20h-5.5M20 20v-5.5" />
        </svg>
      </button>
    </header>
    <main class="stage" id="stage">
      <div class="device" id="device">
        <img class="layer" id="bezel-back" alt="" draggable="false" hidden />
        <div class="aperture" id="aperture">
          <canvas id="screen" aria-label="Shared device screen" role="img"></canvas>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <p class="away" id="away" role="status">Waiting for the device&hellip;</p>
          <p class="note" id="note" role="status"></p>
          <button type="button" class="chip" id="copy-chip" hidden>Copy from device</button>
        </div>
        <img class="layer" id="bezel-front" alt="" draggable="false" hidden />
      </div>
      <form class="name-card" id="name-form" hidden>
        <label for="name-input">Your name <span class="optional">(optional)</span></label>
        <input class="field" id="name-input" maxlength="24" autocomplete="nickname" />
        <button class="primary small" type="submit">Join</button>
        <button class="link" id="name-skip" type="button">Skip</button>
      </form>
    </main>
    <nav class="toolbar" id="toolbar" aria-label="Device controls">
      <div class="group" data-group="hardware">
        <button type="button" data-button="home" title="Home" aria-label="Home">
          <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /></svg>
        </button>
        <button type="button" data-button="back" title="Back" aria-label="Back">
          <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button type="button" data-button="app-switch" title="Apps" aria-label="Apps">
          <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="9" width="11" height="11" rx="2.5" />
            <path d="M9 6.5V6a2 2 0 012-2h7a2 2 0 012 2v7a2 2 0 01-2 2h-.5" />
          </svg>
        </button>
        <button type="button" data-button="lock" title="Lock" aria-label="Lock">
          <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="11" width="12" height="9" rx="2.5" />
            <path d="M8.5 11V8.5a3.5 3.5 0 017 0V11" />
          </svg>
        </button>
      </div>
      <div class="group" data-group="rotate">
        <button type="button" data-rotate="left" title="Rotate left" aria-label="Rotate left">
          <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="11" y="8.5" width="8.5" height="11.5" rx="2.5" />
            <path d="M15 4.6C10.8 4 6.6 6.7 5.6 11.5M8.35 9.5L5.6 11.5L4.11 8.44" />
          </svg>
        </button>
        <button type="button" data-rotate="right" title="Rotate right" aria-label="Rotate right">
          <svg class="symbol" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4.5" y="8.5" width="8.5" height="11.5" rx="2.5" />
            <path d="M9 4.6C13.2 4 17.4 6.7 18.4 11.5M15.65 9.5L18.4 11.5L19.89 8.44" />
          </svg>
        </button>
      </div>
    </nav>
    <footer>
      <p class="credit">
        Shared with <a href="https://stim.appandflow.com" target="_blank" rel="noopener noreferrer">Stim</a> by
        <a href="https://appandflow.com" target="_blank" rel="noopener noreferrer">App &amp; Flow</a>
      </p>
    </footer>
    <script src="/s/assets/clipboard.js"></script>
    <template id="eye">
      <svg class="eye" viewBox="0 0 24 24" aria-label="view only">
        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    </template>
    <script src="/s/assets/overlay.js"></script>
    <script src="/s/assets/gestures.js"></script>
    <script src="/s/assets/keys.js"></script>
    <script src="/s/assets/people.js"></script>
    <script src="/s/assets/rtcpolicy.js"></script>
    <script src="/s/assets/webrtc.js"></script>
    <script src="/s/assets/reconnect.js"></script>
    <script src="/s/assets/viewer.js"></script>
  </body>
</html>
