<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Share ended &middot; Stim</title>
    <link rel="stylesheet" href="/s/assets/viewer.css" />
  </head>
  <body class="page">
    <header class="bar">{{logo}}</header>
    <main class="center">
      <div class="card">
        <h1>This share has ended or the link is wrong</h1>
        <p class="hint">
          The share expired or was stopped, or the address was mistyped. Ask the person who sent it for a new link.
        </p>
      </div>
    </main>
    <footer>
      <p class="credit">
        Shared with <a href="https://stim.appandflow.com" target="_blank" rel="noopener noreferrer">Stim</a> by
        <a href="https://appandflow.com" target="_blank" rel="noopener noreferrer">App &amp; Flow</a>
      </p>
    </footer>
  </body>
</html>
