name: Stim CI
description: Build an app artifact or launch and test an app, retaining evidence through stim-ci.
inputs:
  stage:
    description: build exports an app artifact; run builds, launches, tests and stops the app.
    default: run
  platform:
    description: ios, android, macos, or web.
    required: true
  project:
    description: App directory relative to the checked-out repository.
    default: '.'
  command:
    description: Test command executed by Bash in the app directory. Required only for stage run.
  version:
    description: Exact published @stim-cli/ci version. Required unless cli-path is supplied.
  cli-path:
    description: Built stim-ci executable from the checkout, relative to the repository root.
  artifacts:
    description: Empty results directory relative to the repository root. Defaults to stim-ci-build-results or stim-ci-run-results.

  home:
    description: Optional Stim home. Use a unique runner-temporary directory on disposable workers.
  build-cache:
    description: Optional local build cache directory restored by the workflow.
  timeout:
    description: Session timeout in seconds.
    default: '1800'
  upload-artifacts:
    description: Upload reports and diagnostics, including on failure, plus the completed app artifact for build.
    default: 'true'
  artifact-name:
    description: Unique GitHub artifact name. Defaults to a generated name for this invocation.
  retention-days:
    description: Artifact retention in days. Zero uses the repository default.
    default: '0'
outputs:
  build-artifact:
    description: Absolute path to the completed APK or tar.gz app archive for stage build.
  result:
    description: Absolute path to result.json.
  artifacts:
    description: Absolute diagnostics directory.
  artifact-id:
    description: Uploaded GitHub artifact ID, when an upload succeeds.
  artifact-url:
    description: Uploaded GitHub artifact URL, when an upload succeeds.
runs:
  using: node24
  main: dist/main.mjs
