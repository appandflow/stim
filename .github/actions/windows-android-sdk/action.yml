name: Windows Android SDK
description: JDK 17 plus the system image the windows-latest image lacks, with platform-tools and the emulator on PATH.
runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # The runner image ships the Android SDK, build-tools, platform-tools, NDK
    # and the emulator binary at ANDROID_HOME=C:\Android\android-sdk, but NO
    # system image, so one is installed before Stim can create its own AVD.
    #
    # It DOES have VM acceleration: `emulator -accel-check` on this image
    # answers "WHPX(10.0.26100) is installed and usable", so an owned emulator
    # can boot here. That is measured, not assumed, and the check stays here so
    # the claim keeps being re-verified rather than trusted.
    - name: Record what this runner can actually do
      shell: pwsh
      continue-on-error: true
      run: |
        "ANDROID_HOME=$env:ANDROID_HOME"
        & "$env:ANDROID_HOME\emulator\emulator.exe" -accel-check
        & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --list_installed

    - name: Install a system image so Stim can create its own AVD
      shell: pwsh
      run: |
        $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
        & $sdkmanager --install "platform-tools" "system-images;android-34;google_apis;x86_64"
        "$env:ANDROID_HOME\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "$env:ANDROID_HOME\emulator" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
