name: Windows inventory executor qualification

on:
  push:
    branches: [ci/3086-windows-inventory-executor]
    paths:
      - .github/workflows/qa-inventory-executor.yml
      - test/e2e/native/qualify-inventory-executor.mjs

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Qualify owned child settlement and actual ADB inventory
        env:
          STIM_INVENTORY_QUALIFICATION: ${{ runner.temp }}/stim-inventory-qualification
        run: node test/e2e/native/qualify-inventory-executor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-inventory-executor
          path: ${{ runner.temp }}/stim-inventory-qualification
          if-no-files-found: error
