name: Owned 4081 Windows SDK prerequisite diagnosis
on:
  push:
    branches: [codex/4081-windows-native-probe]
permissions:
  contents: read
jobs:
  prerequisite-only:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare inert argument parsing and SDK version only
        timeout-minutes: 5
        shell: pwsh
        run: python scripts/4081-owned-proof/windows-sdk-prerequisite-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-4081-windows-sdk-prerequisite-diagnosis
          path: ${{ runner.temp }}/stim-4081-sdk-diagnostic/results.json
          if-no-files-found: warn
