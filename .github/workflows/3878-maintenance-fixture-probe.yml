name: 3878 maintenance fixture Windows probe

on:
  push:
    branches: [codex/3878-maintenance-process-fixture]
    paths: [.github/workflows/3878-maintenance-fixture-probe.yml]

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
      - name: Existing maintenance fixture file
        run: pnpm test packages/stim-cli/src/__tests__/maintenance-levels.test.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile.json=test-results/3878-maintenance-windows.json
      - name: Retain fixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3878-maintenance-windows
          path: test-results/3878-maintenance-windows.json
          if-no-files-found: ignore
          retention-days: 7
