name: Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/log-entries-vectors.json'
      - '.github/workflows/mobile.yml'
      - 'knip.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/log-entries-vectors.json'
      - '.github/workflows/mobile.yml'
      - 'knip.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
        with:
          install: 'false'
          build: 'false'
      - run: pnpm install --frozen-lockfile --filter stim-mobile... --filter stim-monorepo
      - run: pnpm --filter @stim-cli/core run build
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run intl:check
      - run: pnpm run typecheck
      - run: pnpm test --ci
      - run: pnpm run licenses:check

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
        with:
          build: 'false'
      - run: pnpm run knip
