name: Merge gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read

jobs:
  merge-gate:
    name: merge gate
    if: always()
    needs: merge-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          # Waits for every other check run, workflow run and commit status on
          # the head SHA, then fails if any ended unsuccessfully.
          api() {
            for _ in 1 2 3; do
              if out=$(gh api --paginate "$@"); then
                jq -s . <<<"$out"
                return 0
              fi
              sleep 10
            done
            return 1
          }
          grace=75
          last=
          while :; do
            elapsed=$SECONDS
            checks=$(api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | {id, name, status, conclusion, suite: .check_suite.id}')
            runs=$(api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | {id, workflow_id, run_number, status, suite: .check_suite_id, event, path, title: .display_title}')
            statuses=$(api "repos/$REPO/commits/$SHA/status?per_page=100" \
              --jq '.statuses[] | {context, state}')
            result=$(jq -n -c --argjson c "$checks" --argjson r "$runs" --argjson s "$statuses" --argjson self "$RUN_ID" '
              def ignored:
                (.path == ".github/workflows/e2e-native.yml" and .title == "Native E2E (unrelated label)")
                or (.path == ".github/workflows/merge-gate.yml" and .event == "workflow_dispatch");
              ($r | map(select(.id != $self and (ignored | not)))) as $runs
              | ($r | map(select(ignored) | .suite)) as $ignored
              | ($c | map(select(.name != "merge gate"))
                    | map(select(.suite as $suite | $ignored | index($suite) | not))
                    | map(. as $k | .wf = (($runs | map(select(.suite == $k.suite)) | first | .workflow_id) // $k.suite))
                    | group_by([.wf, .name]) | map(max_by(.id))) as $checks
              | def superseded($suite):
                  ($runs | map(select(.suite == $suite)) | first) as $me
                  | $me != null and ($runs | any(.workflow_id == $me.workflow_id and .run_number > $me.run_number));
                {
                  pending: ([$checks[] | select(.status != "completed") | .name]
                    + [$runs[] | select(.status != "completed") | "workflow run \(.id)"]
                    + [$s[] | select(.state == "pending") | .context]),
                  failed: ([$checks[]
                      | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))
                      | select((.conclusion == "cancelled" and superseded(.suite)) | not)
                      | "\(.name): \(.conclusion)"]
                    + [$s[] | select(.state == "failure" or .state == "error") | "\(.context): \(.state)"])
                }')
            pending=$(jq -r '.pending | length' <<<"$result")
            if [ "$result" != "$last" ]; then
              echo "[$elapsed s] $result"
              last=$result
            fi
            if [ "$elapsed" -ge "$grace" ] && [ "$pending" -eq 0 ]; then
              failed=$(jq -r '.failed[]' <<<"$result")
              if [ -n "$failed" ]; then
                echo "::error::Checks failed on $SHA. Fix them, then re-run this job."
                echo "$failed"
                exit 1
              fi
              echo "All other checks on $SHA passed."
              exit 0
            fi
            if [ "$elapsed" -lt 600 ]; then sleep 30; else sleep 60; fi
          done

      - name: Require both test shards
        if: always() && github.event_name != 'pull_request'
        env:
          SHARDS: ${{ needs.merge-tests.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$SHARDS" = success
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" |
            jq -e '
              .jobs as $jobs |
              all([1, 2][]; . as $shard |
                any($jobs[]; .name == "merge tests (shard \($shard)/2)" and .conclusion == "success")
              )
            '
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
      - name: Report merge test timings
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/test-timings.mjs merge

  merge-tests:
    name: merge tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
        with:
          node: 22
          build: 'false'

      - if: matrix.shard == 1
        run: pnpm run format:check
      - if: matrix.shard == 1
        run: pnpm run lint
      - if: matrix.shard == 1
        run: node scripts/ratchet.mjs apps/demo-server
      - if: matrix.shard == 1
        working-directory: apps/mobile
        run: node ../../scripts/ratchet.mjs apps/mobile
      - run: pnpm run build
      - if: matrix.shard == 1
        run: node scripts/dist-closure.mjs --enforce cli,ios,android,status,status-command,agent-device,net,agent-driver,api
      - if: matrix.shard == 1 && github.event_name == 'merge_group'
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          node scripts/plugin-api-report.mjs --base "$BASE"
      - if: matrix.shard == 1
        run: pnpm run typecheck
      - if: matrix.shard == 1
        run: pnpm run knip
      - if: matrix.shard == 1
        run: pnpm run rpc:check
      - name: Run Vitest shard
        run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=json --outputFile.json=test-results/merge-${{ matrix.shard }}.json
      - name: Retain merge test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-test-timings-${{ matrix.shard }}
          path: test-results/merge-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
