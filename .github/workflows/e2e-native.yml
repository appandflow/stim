# SLOW native e2e -- a real xcodebuild / gradle build on a real
# simulator/emulator, across the framework x platform matrix:
#
#     framework in {bare, expo}   x   platform in {ios, android, windows}
#
# FOUR SUITES RUN ON THIS MATRIX:
#   smoke   test/e2e/native/run-native-e2e.mjs --smoke -- one worktree: create
#           -> start -> build -> launch -> stop -> cleanup checks. One
#           framework per platform (Expo on iOS and Linux, bare on Windows).
#   loop    test/e2e/native/run-native-e2e.mjs -- docs/field-test-protocol.md as
#           code: create -> start -> build -> second worktree hits the cache ->
#           teardown. What the nightly runs.
#   caches  test/e2e/native/run-cache-e2e.mjs -- for every cache stim-cli supplies,
#           prove it is ENGAGED (read off the real argv/log), that it STORES (the
#           directory gained files), and that a second workspace REUSED it. It
#           costs two extra cold compiles per variant, so it is ON DEMAND ONLY:
#           run it before a release, or after a change that touches caching.
#   pool    test/e2e/native/run-pool-e2e.mjs -- iOS only: park, evict, adopt,
#           and empty the simulator pool on real CoreSimulator devices.
#   all     loop, caches and pool, as separate parallel matrix jobs.
#
# Per platform: iOS runs smoke, loop, caches and pool; Linux Android smoke,
# loop and caches; Windows Android smoke and loop.
#
# WHAT RUNS WHEN. A cold native build is ~10-20 minutes and occasionally flaky
# (device boot, toolchain), so nothing native runs on an unlabeled pull request:
#   - every push to main: the smoke suite on all three platforms;
#   - nightly (schedule), against main: the loop suite;
#   - on demand (workflow_dispatch): the `suite` input;
#   - on a pull request: the union of its labels `e2e-smoke`, `e2e-loop`,
#     `e2e-caches`, `e2e-pool` and `e2e-all` (loop, caches, pool). No label,
#     no native job. Adding a label re-triggers via the `labeled` event.
# The `plan` job turns event, labels and input into one suite list per
# platform through scripts/e2e-plan.mjs (unit-tested in e2e-plan.test.mjs);
# each platform job reads its list as the `suite` matrix axis and is skipped
# when the list is empty.
#
# VARIANT LAYOUT. Each platform is its own job. Framework and selected suite are
# matrix axes. iOS and Android are separate jobs because iOS needs macOS and
# Xcode, while Android needs Linux and KVM; Windows Android proves the paths
# the unit suite fakes (gradlew.bat through cross-spawn, netstat, taskkill).
# Bare and Expo exercise different stim-cli Metro paths. Linux Android runs
# both frameworks; iOS runs Expo ONLY, because the bare template cannot launch
# on iOS 27 (see the matrix `exclude` below); Windows runs bare only, so an
# `all` dispatch is three iOS jobs, four Linux Android jobs and one Windows job.
#
# THE iOS RUNNER IS `xcode-27`, NOT `macos-latest`. Automatic Swift compilation
# caching needs Swift 6.4, which ships with Xcode 27; the macos-26 images top out
# at Xcode 26.6, so on `macos-latest` that branch is unreachable and the `caches`
# suite can only ever observe SWIFT_ENABLE_COMPILE_CACHE=NO. `xcode-27` is a
# GitHub PREVIEW image (actions/runner-images#14404): capacity and stability are
# weaker than a GA image, which is the price of covering the on-path at all.
name: Native E2E

on:
  push:
    branches: [main]
    paths-ignore:
      [
        'apps/desktop/**',
        '.github/workflows/desktop.yml',
        'apps/mobile/**',
        '.github/workflows/mobile.yml',
        'website/docs/**',
      ]
  schedule:
    # 07:00 UTC nightly. Cron has no notion of "against main" -- schedule always
    # runs on the default branch, which is what we want.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run on the framework x platform matrix'
        type: choice
        default: loop
        options: [smoke, loop, caches, pool, all]
      supplement_only:
        description: 'Run only task macOS and web regression jobs'
        type: boolean
        default: false
  pull_request:
    # `labeled` is what makes "add the label to run it" work; the others let a
    # push to an already-labeled PR re-run. The `plan` job is the actual gate
    # -- these types only decide when to EVALUATE it.
    types: [labeled, opened, synchronize, reopened]
    paths-ignore:
      [
        'apps/desktop/**',
        '.github/workflows/desktop.yml',
        'apps/mobile/**',
        '.github/workflows/mobile.yml',
        'website/docs/**',
      ]

concurrency:
  # The event name keeps a push to main from cancelling the nightly loop, which
  # runs on the same ref.
  group: e2e-native-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ inputs.supplement_only && '-supplement' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STIM_E2E_STRICT_QA: '1'

jobs:
  plan:
    name: plan
    if: ${{ !inputs.supplement_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          E2E_PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          E2E_SUITE: ${{ inputs.suite }}
        # An explicit `shell: bash` runs with `-o pipefail`; the runner's
        # default shell does not, and tee would turn a script error into
        # success.
        shell: bash
        run: node scripts/e2e-plan.mjs | tee -a "$GITHUB_OUTPUT"

  ios:
    name: ios ${{ matrix.framework }} (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    runs-on: xcode-27
    # The caches suite adds a second cold compile (the single-flight race) plus a
    # third cache-hit build, so it needs headroom the loop suite never did.
    timeout-minutes: ${{ matrix.suite == 'caches' && 120 || matrix.suite == 'smoke' && 45 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        framework: [bare, expo]
        suite: ${{ fromJSON(needs.plan.outputs.ios) }}
        # No bare variant on iOS. iOS 27 traps an app that has not adopted the
        # UIScene lifecycle (expo/expo#46664). The 0.88.0-rc.1
        # @react-native-community/template ships no SceneDelegate or
        # UIApplicationSceneManifest, so its app builds but traps at launch.
        # Expo SDK 57 opts into scenes; CI pins SDK 58 for RN 0.88 Swift caching.
        # Drop this exclude when the React Native template adopts scenes (#882).
        # A job-level `if:` cannot do this: the matrix context is unavailable.
        exclude:
          - framework: bare
    env:
      STIM_E2E_SUITE: ${{ matrix.suite }}
      # The registry stays throwaway per run (the driver makes its own temp home)
      # for deterministic device/project state; the SHARED build cache is
      # persisted across runs here, so the cross-run cache path is itself
      # exercised. Kept per-variant so bare and expo never address one another's
      # entries.
      STIM_BUILD_CACHE: ${{ github.workspace }}/.e2e-build-cache/ios-${{ matrix.framework }}
      STIM_BUILD_CACHE_KEY: stim-cli-buildcache-v2-ios-${{ matrix.framework }}
      # Keep the throwaway STIM_HOME under the workspace so the failure
      # artifact step can find global workspace logs.
      TMPDIR: ${{ github.workspace }}/.e2e-tmp
      # The default blank template is SDK 57; the harness enables scene support
      # for Xcode 27. Pin SDK 58 here to exercise RN 0.88 Swift compilation
      # caching while keeping the preview SDK out of other fixture lanes.
      STIM_E2E_EXPO_INIT: npx --yes create-expo-app@latest {dir} --template expo-template-blank@sdk-58 --no-install
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR" "$STIM_BUILD_CACHE"

      - uses: ./.github/actions/setup-stim

      - name: Set up Ruby and Bundler for the fixture's Gemfile
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Pin Xcode 27 and prove its Swift 6.4 toolchain
        # maxim-lobanov/setup-xcode cannot pin this image: it keeps only candidates
        # whose LicenseInfo.plist marks them stable, and the sole Xcode here is a
        # prerelease whose real bundle name moves between image revisions
        # (Xcode_27_beta_3.app, then Xcode_27_Release_Candidate.app). The image
        # documents the stable 27.0 symlink, so select it directly. The Swift floor
        # is asserted because a silently older toolchain would leave the caches
        # suite green while never reaching the Swift branch it is here to cover.
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          xcrun swift --version
          swift_version=$(xcrun swift --version | sed -n 's/.*Swift version \([0-9.]*\).*/\1/p' | head -1)
          if [ "$(printf '%s\n6.4\n' "$swift_version" | sort -V | head -1)" != 6.4 ]; then
            echo "::error::runner reports Swift ${swift_version:-unknown}, below the 6.4 the Swift compilation-cache branch needs"
            exit 1
          fi

      - name: Install SimSlim for generated iOS fixtures
        run: brew install mobai-app/tap/simslim

      # The fixture is generated from the latest templates at run time, so no
      # file in this repository predicts its fingerprint. The key is the lane
      # prefix alone, which no saved entry matches exactly, so restore-keys
      # picks the newest entry for the lane; Stim looks the fingerprint up
      # inside it, and the save step after the suite stores a new entry only
      # when the set of fingerprints changed. A restored entry means the first
      # build may be a legitimate cross-run HIT rather than a cold miss.
      - name: Restore cross-run build cache
        if: matrix.suite == 'loop' || matrix.suite == 'smoke'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          key: ${{ env.STIM_BUILD_CACHE_KEY }}-
          restore-keys: |
            ${{ env.STIM_BUILD_CACHE_KEY }}-

      - name: Detect a warmed cross-run cache
        if: matrix.suite == 'loop' || matrix.suite == 'smoke'
        run: |
          echo "build cache: ${{ steps.cache.outputs.cache-matched-key && format('HIT {0}', steps.cache.outputs.cache-matched-key) || 'MISS (no entry for this lane)' }}"
          echo "STIM_E2E_WARM_CACHE=${{ steps.cache.outputs.cache-matched-key && 1 || 0 }}" >> "$GITHUB_ENV"

      - name: Monitor host memory during iOS QA
        continue-on-error: true
        run: |
          node test/e2e/native/monitor-macos-memory.mjs > "$GITHUB_WORKSPACE/ios-memory.jsonl" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/stim-memory-monitor.pid"

      - name: Loop suite (ios, ${{ matrix.framework }})
        if: matrix.suite == 'loop'
        # --keep leaves the temp worktrees in place on this ephemeral runner so
        # the artifact step below can collect their build logs.
        run: node test/e2e/native/run-native-e2e.mjs --framework ${{ matrix.framework }} --platform ios --keep --home "$TMPDIR/stim-cli-home"

      - name: Smoke suite (ios, ${{ matrix.framework }})
        if: matrix.suite == 'smoke'
        run: node test/e2e/native/run-native-e2e.mjs --framework ${{ matrix.framework }} --platform ios --keep --smoke --home "$TMPDIR/stim-cli-home"

      - name: Cache suite (ios, ${{ matrix.framework }})
        if: matrix.suite == 'caches'
        # It forces its own STIM_BUILD_CACHE / STIM_METRO_CACHE under a
        # throwaway home ON PURPOSE (see the file header): every number it
        # reports is a before/after around a COLD compile, and the persisted
        # cross-run cache above would turn each of them into a measurement of
        # nothing. Cache-suite jobs skip the cross-run cache restore.
        # --summary writes the machine-readable verdict where the artifact step
        # can pick it up whether the run passed or failed.
        run: >-
          node test/e2e/native/run-cache-e2e.mjs
          --framework ${{ matrix.framework }} --platform ios --keep --home "$TMPDIR/stim-cli-cache-home"
          --summary "$GITHUB_WORKSPACE/cache-summary-ios-${{ matrix.framework }}.json"

      - name: Simulator pool suite (ios, ${{ matrix.framework }})
        if: matrix.suite == 'pool'
        run: node test/e2e/native/run-pool-e2e.mjs --framework ${{ matrix.framework }} --keep --home "$TMPDIR/stim-cli-pool-home"

      # GitHub scopes a cache to the ref that saved it: an entry from main is
      # visible to every ref, one from a pull request to that pull request
      # alone, so only main saves.
      - name: Trim the cross-run build cache to its newest entries
        if: (matrix.suite == 'loop' || matrix.suite == 'smoke') && github.ref == 'refs/heads/main'
        id: trim
        shell: bash
        run: node scripts/e2e-build-cache.mjs "$STIM_BUILD_CACHE" "$STIM_BUILD_CACHE_KEY" | tee -a "$GITHUB_OUTPUT"

      - name: Save cross-run build cache
        if: steps.trim.outputs.key != '' && steps.trim.outputs.key != steps.cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          key: ${{ steps.trim.outputs.key }}

      - name: Stop host memory monitor
        continue-on-error: true
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/stim-memory-monitor.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/stim-memory-monitor.pid")" 2>/dev/null || true
          fi

      - name: Upload iOS host memory diagnostics
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-memory-ios-${{ matrix.framework }}-${{ matrix.suite }}
          path: ios-memory.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the cache-suite summary
        # `always()`: a FAILING cache run is exactly when the per-check evidence
        # is worth reading, and the summary carries it.
        if: always() && matrix.suite == 'caches'
        uses: actions/upload-artifact@v4
        with:
          name: cache-summary-ios-${{ matrix.framework }}
          path: cache-summary-ios-${{ matrix.framework }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-ios-${{ matrix.framework }}-${{ matrix.suite }}
          path: |
            ${{ env.TMPDIR }}/stim-cli-home/workspaces/**/logs/*
            ${{ env.TMPDIR }}/stim-cli-cache-home/workspaces/**/logs/*
            ${{ env.TMPDIR }}/stim-cli-pool-home/workspaces/**/logs/*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  android:
    name: android ${{ matrix.framework }} (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.android != '[]'
    # A Linux host with KVM: the Android emulator needs hardware acceleration,
    # which the ubuntu-latest GitHub runners provide once /dev/kvm is exposed.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'caches' && 120 || matrix.suite == 'smoke' && 45 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        framework: [bare, expo]
        suite: ${{ fromJSON(needs.plan.outputs.android) }}
        # The smoke suite is one job per platform; Expo matches the iOS side.
        exclude:
          - suite: smoke
            framework: bare
    env:
      STIM_E2E_SUITE: ${{ matrix.suite }}
      STIM_BUILD_CACHE: ${{ github.workspace }}/.e2e-build-cache/android-${{ matrix.framework }}
      STIM_BUILD_CACHE_KEY: stim-cli-buildcache-v2-android-${{ matrix.framework }}
      TMPDIR: ${{ github.workspace }}/.e2e-tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR" "$STIM_BUILD_CACHE"

      - uses: ./.github/actions/setup-stim

      - name: Set up JDK 17
        # gradle for a modern RN/Expo Android build needs a JDK; 17 is the
        # current baseline.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle's dependency cache and wrapper distribution, the download phase
      # of every cold build. The month in the key rotates the entry so it
      # follows the fixture's templates; restore-keys warm a month's first run
      # from the previous entry. An exact hit skips the save, so a dependency
      # the templates add mid-month is downloaded on every run until the
      # rollover, and the week after a rollover holds two entries per lane
      # (4 to 6 GB across the three Android lanes). The caches suite seeds its
      # throwaway Gradle home from these two directories and writes nothing
      # back, so only the other suites save, and only from main (see the build
      # cache save). The daemon holds modules-2.lock open, which fails the
      # archive on Windows (actions/setup-java#633); actions/cache resolves a
      # bare directory pattern to the directory itself and archives it whole,
      # so the pattern lists the children for the exclusion to apply.
      - name: Stamp the Gradle cache key
        id: gradle-key
        run: echo "key=gradle-v1-${{ runner.os }}-${{ matrix.framework }}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Gradle dependency cache
        id: gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/*
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper
          key: ${{ steps.gradle-key.outputs.key }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-${{ matrix.framework }}-

      # See the iOS job for the key design.
      - name: Restore cross-run build cache
        if: matrix.suite == 'loop' || matrix.suite == 'smoke'
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          key: ${{ env.STIM_BUILD_CACHE_KEY }}-
          restore-keys: |
            ${{ env.STIM_BUILD_CACHE_KEY }}-

      # Expose /dev/kvm to the emulator (the standard incantation the
      # android-emulator-runner README recommends).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Detect a warmed cross-run cache
        if: matrix.suite == 'loop' || matrix.suite == 'smoke'
        run: |
          echo "build cache: ${{ steps.cache.outputs.cache-matched-key && format('HIT {0}', steps.cache.outputs.cache-matched-key) || 'MISS (no entry for this lane)' }}"
          echo "STIM_E2E_WARM_CACHE=${{ steps.cache.outputs.cache-matched-key && 1 || 0 }}" >> "$GITHUB_ENV"

      - name: Native e2e (android, ${{ matrix.framework }}) -- runs the selected suite(s)
        # reactivecircus/android-emulator-runner installs the SDK + system image,
        # enables acceleration, and runs `script` once an emulator is up. stim-cli
        # then creates and boots its OWN owned AVD (the ownership rule forbids it
        # from touching a device it did not create -- see CLAUDE.md item 2), so
        # the action's emulator is only there to guarantee the SDK/KVM
        # environment; stim-cli does the device work itself.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A fast, headless boot; the assertions do not need a window.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          # The action's own emulator only proved the SDK/KVM environment; kill it
          # before the driver runs so stim-cli's owned emulator gets the runner's
          # full memory and CPU (two emulators on a 7 GB runner starve the boot).
          script: |
            adb -s emulator-5554 emu kill || true
            sleep 3
            if [ "$STIM_E2E_SUITE" = loop ]; then node test/e2e/native/run-native-e2e.mjs --framework ${{ matrix.framework }} --platform android --keep --home "$TMPDIR/stim-cli-home"; fi
            if [ "$STIM_E2E_SUITE" = smoke ]; then node test/e2e/native/run-native-e2e.mjs --framework ${{ matrix.framework }} --platform android --keep --smoke --home "$TMPDIR/stim-cli-home"; fi
            if [ "$STIM_E2E_SUITE" = caches ]; then node test/e2e/native/run-cache-e2e.mjs --framework ${{ matrix.framework }} --platform android --keep --home "$TMPDIR/stim-cli-cache-home" --summary "$GITHUB_WORKSPACE/cache-summary-android-${{ matrix.framework }}.json"; fi

      - name: Trim the cross-run build cache to its newest entries
        if: (matrix.suite == 'loop' || matrix.suite == 'smoke') && github.ref == 'refs/heads/main'
        id: trim
        shell: bash
        run: node scripts/e2e-build-cache.mjs "$STIM_BUILD_CACHE" "$STIM_BUILD_CACHE_KEY" | tee -a "$GITHUB_OUTPUT"

      - name: Save cross-run build cache
        if: steps.trim.outputs.key != '' && steps.trim.outputs.key != steps.cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          key: ${{ steps.trim.outputs.key }}

      - name: Save the Gradle dependency cache
        if: matrix.suite != 'caches' && github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/*
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper
          key: ${{ steps.gradle-key.outputs.key }}

      - name: Upload the cache-suite summary
        if: always() && matrix.suite == 'caches'
        uses: actions/upload-artifact@v4
        with:
          name: cache-summary-android-${{ matrix.framework }}
          path: cache-summary-android-${{ matrix.framework }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-android-${{ matrix.framework }}-${{ matrix.suite }}
          path: |
            ${{ env.TMPDIR }}/stim-cli-home/workspaces/**/logs/*
            ${{ env.TMPDIR }}/stim-cli-cache-home/workspaces/**/logs/*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The Android half of the dev loop on Windows, driven by the same fixture and
  # driver as the lanes above, bare framework only. Real proof of the paths the
  # unit suite fakes: gradlew.bat through cross-spawn, Metro listener discovery
  # through netstat, adb and the emulator, and the taskkill tree kill on stop.
  #
  # The SDK, system image and acceleration facts live in
  # .github/actions/windows-android-sdk, shared with windows-debug.yml.
  #
  windows:
    name: android bare (${{ matrix.suite }}, windows)
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.suite == 'loop' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.windows) }}
    env:
      # os.tmpdir() reads TEMP on Windows, and the driver builds its fixture
      # under it. It is D:\e rather than a path inside the workspace because
      # every CMake object path is built from the fixture root and Windows caps
      # a path at 260 characters.
      TEMP: D:\e
      TMP: D:\e
      STIM_BUILD_CACHE: D:\e\build-cache
      STIM_BUILD_CACHE_KEY: stim-cli-buildcache-v2-windows-android-bare
    steps:
      - uses: actions/checkout@v4
      - run: New-Item -ItemType Directory -Force -Path "D:\e", "D:\e\build-cache"
      - uses: ./.github/actions/setup-stim
      - uses: ./.github/actions/windows-android-sdk

      # See the Linux Android job for the Gradle key design.
      - name: Stamp the Gradle cache key
        id: gradle-key
        shell: bash
        run: echo "key=gradle-v1-${{ runner.os }}-bare-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore the Gradle dependency cache
        id: gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/*
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper
          key: ${{ steps.gradle-key.outputs.key }}
          restore-keys: |
            gradle-v1-${{ runner.os }}-bare-

      # See the iOS job for the key design.
      - name: Restore cross-run build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          key: ${{ env.STIM_BUILD_CACHE_KEY }}-
          restore-keys: |
            ${{ env.STIM_BUILD_CACHE_KEY }}-

      - name: Detect a warmed cross-run cache
        run: |
          "build cache: ${{ steps.cache.outputs.cache-matched-key && format('HIT {0}', steps.cache.outputs.cache-matched-key) || 'MISS (no entry for this lane)' }}"
          "STIM_E2E_WARM_CACHE=${{ steps.cache.outputs.cache-matched-key && 1 || 0 }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Doctor (android)
        continue-on-error: true
        run: node packages/stim-cli/dist/cli.mjs doctor --platform android

      # --keep leaves the fixture and its worktrees on this ephemeral runner so
      # the upload below can read their logs.
      - name: Android ${{ matrix.suite }} e2e (bare)
        run: >-
          node test/e2e/native/run-native-e2e.mjs
          --framework bare --platform android --keep --home "D:\e\stim-home"
          ${{ matrix.suite == 'smoke' && '--smoke' || '' }}

      - name: Trim the cross-run build cache to its newest entries
        if: github.ref == 'refs/heads/main'
        id: trim
        shell: bash
        run: node scripts/e2e-build-cache.mjs "$STIM_BUILD_CACHE" "$STIM_BUILD_CACHE_KEY" | tee -a "$GITHUB_OUTPUT"

      - name: Save cross-run build cache
        if: steps.trim.outputs.key != '' && steps.trim.outputs.key != steps.cache.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          key: ${{ steps.trim.outputs.key }}

      - name: Save the Gradle dependency cache
        if: github.ref == 'refs/heads/main' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2/*
            !~/.gradle/caches/modules-2/*.lock
            !~/.gradle/caches/modules-2/gc.properties
            ~/.gradle/wrapper
          key: ${{ steps.gradle-key.outputs.key }}

      - name: Upload build and device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-android-${{ matrix.suite }}-logs
          path: D:\e\stim-home\workspaces\**\logs\*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ios-bare-qa:
    name: ios bare (${{ matrix.suite }}, Xcode 26.6)
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'all' && !inputs.supplement_only
    runs-on: macos-26
    timeout-minutes: ${{ matrix.suite == 'caches' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [loop, caches]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TMPDIR: ${{ github.workspace }}/.e2e-bare-ios-tmp
      STIM_BUILD_CACHE: ${{ github.workspace }}/.e2e-bare-ios-cache
      STIM_E2E_IOS_RUNTIME: '26.5'
      STIM_E2E_IOS_DEVICE_TYPE: iPhone 17
      STIM_E2E_EXPECT_RN: 0.88.0-rc.1
      STIM_E2E_BARE_INIT: >-
        npx --yes @react-native-community/cli@20.2.0 init StimE2E
        --directory {dir} --skip-git-init --install-pods false --pm npm
        --version 0.88.0-rc.1 --template @react-native-community/template@0.88.0-rc.1-76420c7
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR" "$STIM_BUILD_CACHE"
      - uses: ./.github/actions/setup-stim
        with:
          node: 22.18.0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.10
      - name: Install and verify fixture tooling
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/MobAI-App/simslim/releases/download/v0.12.0/simslim-v0.12.0-macos-arm64.tar.gz \
            --output "$RUNNER_TEMP/simslim.tar.gz"
          printf '%s  %s\n' 1b2f30af154dc19620631569ed39a486e79899b14243ee826742a26b458e6cdd "$RUNNER_TEMP/simslim.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/stim-qa-tools"
          tar -xzf "$RUNNER_TEMP/simslim.tar.gz" -C "$RUNNER_TEMP/stim-qa-tools" simslim
          echo "$RUNNER_TEMP/stim-qa-tools" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/stim-qa-tools:$PATH"
          xcodebuild -version | tee xcode-bare-ios.txt
          grep -Fx 'Xcode 26.6' xcode-bare-ios.txt
          grep -Fx 'Build version 17F113' xcode-bare-ios.txt
          simslim --version | tee simslim-bare-ios.txt
          grep -E '(^|[^0-9])0\.12\.0([^0-9]|$)' simslim-bare-ios.txt
          xcrun simctl list runtimes --json > runtimes-bare-ios.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("runtimes-bare-ios.json", "utf8")).runtimes; if (!r.some(x => x.version === process.env.STIM_E2E_IOS_RUNTIME && x.isAvailable)) throw new Error("Pinned iOS 26.5 runtime unavailable");'
          node --version
          ruby --version
          bundle --version
      - name: Strict bare iOS loop
        if: matrix.suite == 'loop'
        run: >-
          node test/e2e/native/run-native-e2e.mjs
          --framework bare --platform ios --keep --home "$TMPDIR/stim-cli-home"
      - name: Strict bare iOS caches
        if: matrix.suite == 'caches'
        run: >-
          node test/e2e/native/run-cache-e2e.mjs
          --framework bare --platform ios --keep --home "$TMPDIR/stim-cli-cache-home"
          --summary "$GITHUB_WORKSPACE/cache-summary-bare-ios.json"
      - name: Preserve bare iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bare-ios-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            xcode-bare-ios.txt
            simslim-bare-ios.txt
            runtimes-bare-ios.json
            cache-summary-bare-ios.json
            ${{ env.TMPDIR }}/**/logs/*
            ${{ env.TMPDIR }}/**/app/package.json
            ${{ env.TMPDIR }}/**/app/package-lock.json
            ${{ env.TMPDIR }}/**/app/Gemfile.lock
            ${{ env.TMPDIR }}/**/app/.stim.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  macos-runtime-and-tools:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'all'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set task QA path
        shell: bash
        run: echo "QA_ROOT=$RUNNER_TEMP/stim-convergence-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-stim
      - name: Record toolchain and require installed Chrome
        shell: bash
        run: |
          mkdir -p "$QA_ROOT/evidence"
          {
            git rev-parse HEAD
            node --version
            sw_vers
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphonesimulator --show-sdk-version
            test -x '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
            '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' --version
          } > "$QA_ROOT/evidence/toolchain.txt" 2>&1
      - name: Check formatting including task-only QA files
        shell: bash
        run: pnpm run format:check 2>&1 | tee "$QA_ROOT/evidence/format.log"
      - name: Lint including task-only QA files
        shell: bash
        run: pnpm run lint 2>&1 | tee "$QA_ROOT/evidence/lint.log"
      - name: Full macOS unit suite
        shell: bash
        run: |
          pnpm run test --reporter=default --reporter=json \
            --outputFile="$QA_ROOT/evidence/unit.json" 2>&1 | tee "$QA_ROOT/evidence/unit.log"
      - name: Full macOS E2E suite
        shell: bash
        run: pnpm run test:e2e 2>&1 | tee "$QA_ROOT/evidence/e2e.log"
      - name: Real SwiftPM and configured browser CLI lifecycle
        shell: bash
        run: node scripts/qa/platform-convergence.mjs run "$QA_ROOT" 2>&1 | tee "$QA_ROOT/evidence/lifecycle.log"
      - name: Scoped fixture cleanup
        if: always()
        shell: bash
        run: node scripts/qa/platform-convergence.mjs cleanup "$QA_ROOT"
      - name: Real nonphysical compatibility tests
        shell: bash
        run: |
          pnpm run test:compat \
            packages/stim-cli/src/__tests__/engine-xcode.compat.test.ts \
            packages/stim-cli/src/__tests__/engine-ios-signing.compat.test.ts \
            packages/stim-cli/src/__tests__/web-chrome.compat.test.ts \
            --maxWorkers=1 --reporter=default --reporter=json \
            --outputFile="$QA_ROOT/evidence/compat.json" 2>&1 | tee "$QA_ROOT/evidence/compat.log"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync(process.env.QA_ROOT + "/evidence/compat.json", "utf8"));
            assert.equal(report.success, true);
            assert.equal(report.numFailedTests, 0);
            assert.equal(report.numPendingTests, 0);
            const expected = ["engine-xcode.compat.test.ts", "engine-ios-signing.compat.test.ts", "web-chrome.compat.test.ts"];
            assert.equal(report.testResults.length, expected.length);
            for (const file of expected) {
              const result = report.testResults.find((entry) => entry.name.endsWith("/" + file));
              assert(result, "Missing compatibility file: " + file);
              assert.equal(result.status, "passed");
              assert(result.assertionResults.length > 0);
              assert(result.assertionResults.every((test) => test.status === "passed"));
            }
            console.log("Passed compatibility tests:", report.numPassedTests);
          '
      - name: Upload results and runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-convergence-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QA_ROOT }}/evidence
            ${{ env.QA_ROOT }}/manifest.json
            ${{ env.QA_ROOT }}/stim-home/workspaces/**/logs/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  task-expo-web:
    name: task Expo web and public API regression
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/refactor/platform-convergence-local'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set task QA path
        run: echo "EXPO_WEB_QA_OUT=$RUNNER_TEMP/stim-platform-qa-expo-web" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-stim
        with:
          node: '24'
      - name: Record installed Chrome
        run: google-chrome --version
      - name: Real Expo web regression
        run: node test/e2e/native/task-expo-web.mjs run "$EXPO_WEB_QA_OUT"
      - name: Retry scoped cleanup
        if: always()
        run: node test/e2e/native/task-expo-web.mjs cleanup "$EXPO_WEB_QA_OUT"
      - name: Upload Expo web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-expo-web-${{ github.sha }}
          path: |
            ${{ env.EXPO_WEB_QA_OUT }}/manifest.json
            ${{ env.EXPO_WEB_QA_OUT }}/evidence/**
            ${{ env.EXPO_WEB_QA_OUT }}/stim-home/workspaces/**/logs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
