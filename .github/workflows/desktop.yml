name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'packages/server/helper/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['apps/desktop/**', 'packages/server/helper/**', '.github/workflows/desktop.yml']

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Compile the stim-server frames helper
        run: |
          sed 's|^|Sources/|' ../../packages/server/helper/desktop-sources.txt \
            | xargs xcrun swiftc -O -swift-version 5 -module-name StimFrames -o "$RUNNER_TEMP/stim-frames" \
              ../../packages/server/helper/main.swift
