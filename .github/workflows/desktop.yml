name: Desktop

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/src/design/tokens.ts'
      - 'apps/mobile/src/lib/agent-prompts.ts'
      - 'packages/server/helper/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/src/design/tokens.ts'
      - 'apps/mobile/src/lib/agent-prompts.ts'
      - 'packages/server/helper/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun swift-format --version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the generated design tokens, agent prompts and tutorial steps
        run: node scripts/generate-tokens.mjs --check
      - name: Check Sources stay ASCII
        run: node scripts/check-ascii.mjs
      - name: Lint Swift formatting
        run: scripts/format.sh --check
      - run: swift build -Xswiftc -warnings-as-errors
      - name: Check the linked SDK
        run: |
          otool -l .build/debug/StimDesktop | awk '
            /LC_BUILD_VERSION/ { build_version = 1 }
            build_version && $1 == "sdk" { sdk = $2; exit }
            END {
              print "Linked SDK: " sdk
              if (sdk + 0 < 26) {
                print "Linked SDK must be 26 or newer for Liquid Glass." > "/dev/stderr"
                exit 1
              }
            }
          '
      - run: swift test -Xswiftc -warnings-as-errors
      - name: Compile the stim-server frames helper
        run: |
          sed 's|^|Sources/|' ../../packages/server/helper/desktop-sources.txt \
            | xargs xcrun swiftc -O -swift-version 5 -module-name StimFrames -o "$RUNNER_TEMP/stim-frames" \
              ../../packages/server/helper/main.swift ../../packages/server/helper/VideoEncoder.swift \
              ../../packages/server/helper/PhoneSource.swift ../../packages/server/helper/MacosSource.swift \
              ../../packages/server/helper/FrameArtwork.swift ../../packages/server/helper/DuoFrameRenderer.swift \
              ../../packages/server/helper/DuoHingeMonitor.swift ../../packages/server/helper/DuoCaptureSource.swift
      - name: Package an ad-hoc release build
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: scripts/release.sh 0.0.0
