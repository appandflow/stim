name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/src/design/tokens.ts'
      - 'apps/mobile/src/lib/agent-prompts.ts'
      - 'packages/server/helper/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/mobile/src/design/tokens.ts'
      - 'apps/mobile/src/lib/agent-prompts.ts'
      - 'packages/server/helper/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check the generated design tokens and agent prompts
        run: node scripts/generate-tokens.mjs --check
      - name: Lint Swift formatting
        run: scripts/format.sh --check
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test -Xswiftc -warnings-as-errors
      - name: Compile the stim-server frames helper
        run: |
          sed 's|^|Sources/|' ../../packages/server/helper/desktop-sources.txt \
            | xargs xcrun swiftc -O -swift-version 5 -module-name StimFrames -o "$RUNNER_TEMP/stim-frames" \
              ../../packages/server/helper/main.swift ../../packages/server/helper/VideoEncoder.swift \
              ../../packages/server/helper/PhoneSource.swift
      - name: Package an ad-hoc release build
        run: scripts/release.sh 0.0.0
