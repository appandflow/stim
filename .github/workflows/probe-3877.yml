name: Probe merge state classification

on:
  push:
    branches: [codex/3877-windows-merge-state]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '22'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
        with:
          node: ${{ matrix.node }}
      - name: Verify expanded suite discovery
        shell: bash
        run: |
          probe_test_file=packages/stim-cli/src/__tests__/merge-state.integration.test.ts
          pnpm exec vitest list "$probe_test_file" --json --no-staticParse > merge-state-default.json
          pnpm exec vitest list --config vitest.integration.config.ts "$probe_test_file" --json --no-staticParse > merge-state-integration.json
          pnpm exec vitest list --config vitest.unit.config.ts "$probe_test_file" --json --no-staticParse --passWithNoTests > merge-state-unit.json
          node --input-type=module -e 'import fs from "node:fs"; for (const [name, expected] of [["default", 11], ["integration", 11], ["unit", 0]]) { const cases = JSON.parse(fs.readFileSync(`merge-state-${name}.json`, "utf8")); console.log(name, cases.length); if (cases.length !== expected) throw new Error(`${name} discovery mismatch`); }'
      - name: Existing whole-file merge-state contracts
        env:
          NODE_OPTIONS: --trace-uncaught
        run: pnpm run test:integration packages/stim-cli/src/__tests__/merge-state.integration.test.ts --reporter=verbose --reporter=json --reporter=./.github/diagnostics/3877-budget-reporter.mjs --outputFile.json=merge-state-3877-results.json
      - name: Retain probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-state-3877-${{ runner.os }}-node-${{ matrix.node }}
          path: merge-state-*.json
          if-no-files-found: ignore
          retention-days: 7
