name: Stim CI dogfood

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'scripts/ci/**'
      - '.github/actions/stim-ci/**'
      - '.github/workflows/stim-ci.yml'
      - 'pnpm-lock.yaml'
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths:
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - 'packages/**'
      - 'scripts/ci/**'
      - '.github/actions/stim-ci/**'
      - '.github/workflows/stim-ci.yml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: stim-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e-smoke')
    name: ${{ matrix.platform }} app lifecycle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runner: xcode-27-xlarge
            project: apps/mobile
    env:
      APP_VARIANT: development
      STIM_HOME: ${{ github.workspace }}/.stim-ci-home
      STIM_BIN: ${{ github.workspace }}/packages/stim-cli/dist/cli.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim

      - uses: ruby/setup-ruby@v1
        if: matrix.platform == 'ios'
        with:
          ruby-version: '3.4'

      - name: Select Xcode
        if: matrix.platform != 'android'
        env:
          XCODE_PATH: ${{ matrix.platform == 'ios' && '/Applications/Xcode_27.0.app' || '/Applications/Xcode_26.3.app' }}
        run: sudo xcode-select -s "$XCODE_PATH"

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android tools and KVM
        if: matrix.platform == 'android'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'emulator' 'system-images;android-34;google_apis;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          node packages/stim-cli/dist/cli.mjs settings set android.systemImage 'system-images;android-34;google_apis;x86_64' --scope machine

      - name: Retain host capacity samples
        shell: bash
        run: |
          mkdir -p stim-ci-host
          node --input-type=module <<'JS' > stim-ci-host/samples.log 2>&1 &
          import { existsSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { setTimeout } from 'node:timers/promises';
          const deadline = Date.now() + 60 * 60_000;
          while (Date.now() < deadline && !existsSync('stim-ci-host/stop')) {
            console.log(new Date().toISOString());
            for (const [file, args] of [['uptime', []], ['vm_stat', []], ['sysctl', ['hw.memsize', 'hw.ncpu']], ['/bin/ps', ['-A', '-o', 'pid=,ppid=,state=,%cpu=,rss=,comm=']]]) {
              try { console.log(execFileSync(file, args, { encoding: 'utf8', timeout: 5000, maxBuffer: 512 * 1024 })); }
              catch (error) { console.log(`${file}: ${error.message}`); }
            }
            await setTimeout(15000);
          }
          writeFileSync('stim-ci-host/done', new Date().toISOString());
          JS

      - name: Build and upload the app artifact
        uses: ./.github/actions/stim-ci
        with:
          stage: build
          cli-path: packages/ci/dist/stim-ci.mjs
          platform: ${{ matrix.platform }}
          project: ${{ matrix.project }}
          artifacts: stim-ci-results/${{ matrix.platform }}/build
          timeout: '2400'
          artifact-name: stim-ci-${{ matrix.platform }}-build
          retention-days: '7'

      - name: Build, launch, probe and stop
        uses: ./.github/actions/stim-ci
        with:
          cli-path: packages/ci/dist/stim-ci.mjs
          platform: ${{ matrix.platform }}
          project: ${{ matrix.project }}
          command: node ../../scripts/ci/app-smoke.mjs
          artifacts: stim-ci-results/${{ matrix.platform }}/first
          timeout: '2400'
          artifact-name: stim-ci-${{ matrix.platform }}-first
          retention-days: '7'

      - name: Repeat with the job's warm build state
        uses: ./.github/actions/stim-ci
        with:
          cli-path: packages/ci/dist/stim-ci.mjs
          platform: ${{ matrix.platform }}
          project: ${{ matrix.project }}
          command: node ../../scripts/ci/app-smoke.mjs
          artifacts: stim-ci-results/${{ matrix.platform }}/warm
          timeout: '600'
          artifact-name: stim-ci-${{ matrix.platform }}-warm
          retention-days: '7'

      - name: Finish host sampling
        if: always()
        shell: bash
        run: |
          mkdir -p stim-ci-host
          touch stim-ci-host/stop
          for ((attempt = 0; attempt < 40; attempt++)); do
            if test -f stim-ci-host/done; then break; fi
            sleep 1
          done
          if ! test -f stim-ci-host/done; then echo 'Sampler did not acknowledge stop; retained sample is partial.'; fi

      - name: Upload host capacity samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stim-ci-ios-host
          path: |
            stim-ci-host/
            .stim-ci-home/logs/debug/
          include-hidden-files: true
          retention-days: 7
