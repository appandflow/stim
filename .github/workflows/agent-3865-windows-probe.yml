name: Agent 3865 Windows report cancellation probe
on:
  push:
    branches: [codex/3865-windows-report-cancellation]
    paths: [.github/workflows/agent-3865-windows-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
        with:
          node: '22'
      - name: Repeat the unchanged-budget complete file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          foreach ($sample in 1..3) {
            Write-Output "3865 sample=$sample start=$([DateTime]::UtcNow.ToString('O'))"
            & pnpm test packages/stim-cli/src/__tests__/report-runtime.integration.test.ts --maxWorkers 1 --reporter=default --reporter=json --outputFile.json="test-results/report-runtime-$sample.json"
            if ($LASTEXITCODE -ne 0) { throw "Sample $sample failed; stopping without a retry." }
          }
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-runtime-3865-results
          path: test-results/report-runtime-*.json
          if-no-files-found: warn
          retention-days: 7
