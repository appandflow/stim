name: Temporary Windows report handshake probe

on:
  push:
    branches: [codex/4726-report-launcher-handshake]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-stim
      - name: Prove delayed observer RED and GREEN, then run clean fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture=packages/stim-cli/src/__tests__/report-runtime.integration.test.ts
          saved="$RUNNER_TEMP/4726-handshake.ts"
          cp "$fixture" "$saved"
          trap 'cp "$saved" "$fixture"' EXIT
          lag_fixture() {
            node --input-type=module - "$fixture" <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = process.argv[2];
          const source = readFileSync(path, 'utf8');
          const start = source.indexOf('a claimed launcher stays declared');
          const point = source.indexOf('const identity = captureProcessIdentity(pid);', start);
          if (start < 0 || point < start) throw new Error('Target fixture capture not found');
          writeFileSync(path, source.slice(0, point) + 'Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 500);\n' + source.slice(point));
          NODE
          }
          git show 28c96d1c1ad47e331914c28317a2758c345196d2:"$fixture" > "$fixture"
          lag_fixture
          status=0
          pnpm test "$fixture" -t 'a claimed launcher stays declared' --maxWorkers 1 --retry 0 > "$RUNNER_TEMP/4726-baseline.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/4726-baseline.log"
          if [ "$status" -eq 0 ]; then
            echo 'Baseline did not reproduce the delayed-observer failure'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const log = readFileSync(join(process.env.RUNNER_TEMP, '4726-baseline.log'), 'utf8');
          if (!log.includes('NOT_FOUND') || !log.includes('The controlled descendant did not start')) {
            throw new Error('Baseline failed for a different reason');
          }
          NODE
          cp "$saved" "$fixture"
          lag_fixture
          pnpm test "$fixture" -t 'a claimed launcher stays declared' --maxWorkers 1 --retry 0 2>&1 | tee "$RUNNER_TEMP/4726-handshake-delayed.log"
          cp "$saved" "$fixture"
          pnpm test "$fixture" --maxWorkers 1 2>&1 | tee "$RUNNER_TEMP/4726-handshake-clean.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-report-handshake-evidence
          path: ${{ runner.temp }}/4726-*.log
