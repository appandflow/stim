name: Mobile release

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      mode:
        description: auto publishes an update when the latest production build has the same runtime, and builds and submits otherwise.
        type: choice
        options: [auto, update, build]
        default: auto

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The ref is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on main. Release from main."
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install before any secret is loaded
        run: npm ci

      - name: The tag matches the app version
        if: github.event_name == 'push'
        run: |
          version="$(npx expo config --json | jq -r .version)"
          if [ "$GITHUB_REF_NAME" != "mobile-v$version" ]; then
            echo "::error::$GITHUB_REF_NAME does not match version $version in app.config.ts."
            exit 1
          fi

      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 24.8.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Choose update or build
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            mode=build
          else
            mode="$INPUT_MODE"
          fi
          if [ "$mode" = auto ]; then
            fingerprint="$(npx expo-updates fingerprint:generate --platform ios | jq -r .hash)"
            runtime="$(eas build:list --platform ios --build-profile production --status finished --limit 1 --json --non-interactive | jq -r '.[0].runtime.version // empty')"
            echo "fingerprint=$fingerprint latest production build runtime=${runtime:-none}"
            if [ -n "$runtime" ] && [ "$runtime" = "$fingerprint" ]; then
              mode=update
            else
              mode=build
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "::notice::Mobile release mode: $mode"

      - name: Publish an update
        if: steps.mode.outputs.mode == 'update'
        run: |
          message="$(git log -1 --format=%s)"
          eas update --channel production --environment production --platform ios --message "$message" --non-interactive

      - name: Build and submit to TestFlight
        if: steps.mode.outputs.mode == 'build'
        run: eas build --platform ios --profile production --non-interactive --auto-submit
