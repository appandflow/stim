# DISPATCH-ONLY. Prepares a windows-latest runner the same way the
# windows-android-e2e job in ci.yml does, then opens SSH to it over Tailscale
# and holds so the Android loop can be worked on interactively (#888).
#
# Needs a TAILSCALE_AUTHKEY repository secret (ephemeral, reusable auth key).
# The node leaves the tailnet when the job ends. Create a file named `stop` in
# the workspace to end the hold early. GitHub caps a job at 6 hours.
#
#   gh workflow run windows-debug.yml -F public_key=@~/.ssh/id_rsa.pub -f hours=2
#   ssh runneradmin@stim-windows-runner
name: Windows debug host

on:
  workflow_dispatch:
    inputs:
      public_key:
        description: 'SSH public key allowed to log in as runneradmin'
        required: true
        type: string
      hours:
        description: 'How long to hold the runner (max 6)'
        required: false
        default: '2'
        type: string
      prepare:
        description: 'Install, build and add the Android system image before opening SSH'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  host:
    name: windows debug host
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      TEMP: ${{ github.workspace }}\e2e-tmp
      TMP: ${{ github.workspace }}\e2e-tmp
    steps:
      - uses: actions/checkout@v4
      - run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\e2e-tmp"

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build
        if: inputs.prepare
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install a system image so Stim can create its own AVD
        if: inputs.prepare
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdkmanager --install "platform-tools" "system-images;android-34;google_apis;x86_64"

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: stim-windows-runner

      # SSH sessions do not see GITHUB_ENV or GITHUB_PATH, so the toolchain
      # locations are written to the machine environment instead.
      - name: Open SSH
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          New-Item -Path "HKLM:\SOFTWARE\OpenSSH" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "C:\Program Files\PowerShell\7\pwsh.exe" -PropertyType String -Force | Out-Null
          $keys = "C:\ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $keys -Value "${{ inputs.public_key }}" -Encoding ascii
          icacls $keys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" | Out-Null
          [Environment]::SetEnvironmentVariable('JAVA_HOME', $env:JAVA_HOME, 'Machine')
          [Environment]::SetEnvironmentVariable('TEMP', $env:TEMP, 'Machine')
          [Environment]::SetEnvironmentVariable('TMP', $env:TMP, 'Machine')
          $machinePath = [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          $extra = @("$env:ANDROID_HOME\platform-tools", "$env:ANDROID_HOME\emulator", "$env:JAVA_HOME\bin", (Split-Path (Get-Command pnpm).Source), (Split-Path (Get-Command node).Source))
          [Environment]::SetEnvironmentVariable('PATH', (($extra + $machinePath) -join ';'), 'Machine')
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          "ssh runneradmin@$(tailscale ip -4)  (MagicDNS: stim-windows-runner)"

      - name: Hold
        run: |
          $deadline = (Get-Date).AddHours([math]::Min([double]"${{ inputs.hours }}", 5.8))
          "holding until $deadline; create $env:GITHUB_WORKSPACE\stop to end early"
          while ((Get-Date) -lt $deadline -and -not (Test-Path "$env:GITHUB_WORKSPACE\stop")) { Start-Sleep -Seconds 30 }
