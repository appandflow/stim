name: CI
run-name: Windows workspace diff cleanup probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-diff-cleanup:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
      - name: Repeat the real over-budget fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workspace-diff-cleanup"
          git rev-parse HEAD > "$RUNNER_TEMP/workspace-diff-cleanup/source-sha.txt"
          for attempt in {1..40}; do
            echo "Attempt $attempt" | tee -a "$RUNNER_TEMP/workspace-diff-cleanup/fixtures.log"
            pnpm test packages/server/__tests__/workspace-diff.test.ts -t 'reports tracked binary and over-budget patches without returning contents' 2>&1 | tee -a "$RUNNER_TEMP/workspace-diff-cleanup/fixtures.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-diff-cleanup
          path: ${{ runner.temp }}/workspace-diff-cleanup
          if-no-files-found: error
          retention-days: 7
