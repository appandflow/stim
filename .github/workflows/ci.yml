name: Task macOS unit validation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact public commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-units:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      REQUESTED_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate source identity
        shell: bash
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "QA_ROOT=$RUNNER_TEMP/stim-3090-macos-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checked out commit
        shell: bash
        run: |
          mkdir -p "$QA_ROOT"
          git rev-parse HEAD > "$QA_ROOT/source-sha.txt"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          assert Path(os.environ['QA_ROOT'], 'source-sha.txt').read_text().strip() == os.environ['REQUESTED_SHA']
          PYTHON
      - uses: ./.github/actions/setup-stim
      - name: Record toolchain
        shell: bash
        run: |
          {
            node --version
            sw_vers
            xcodebuild -version
            xcrun swift --version
          } > "$QA_ROOT/toolchain.txt" 2>&1
      - name: Full macOS unit suite
        shell: bash
        run: |
          set -o pipefail
          pnpm run test --reporter=default --reporter=json \
            --outputFile="$QA_ROOT/unit.json" 2>&1 | tee "$QA_ROOT/unit.log"
      - name: Upload unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-unit-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QA_ROOT }}
          if-no-files-found: error
          retention-days: 14
