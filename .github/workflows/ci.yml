#
# Everything provable on a plain Linux box with no Xcode and no Android SDK:
# lint, format, typecheck, build, the full vitest unit suite (all six
# packages), and the fast cross-platform e2e (test/e2e/cache-flow.e2e.js), which
# drives the real CLI and the real cache library end to end with no compiler.
# The macOS and Windows jobs below run only with `full`: the Full suite
# workflow (nightly, before a stable release, on the `ci-full` label) passes
# it, and so does a dispatch of this workflow. A pull request, the merge queue
# and a push to main run the two Linux jobs only. The SLOW native builds live in
# e2e-native.yml.
name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also run the macOS and Windows jobs
        type: boolean
        default: true
      build_stage_macos:
        description: Validate build-only Apple operations and artifact export on macOS
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '**'
      - '!website/docs/**'
      - '!apps/desktop/**'
      - '!.github/workflows/desktop.yml'
      - '!apps/mobile/**'
      - '!.github/workflows/mobile.yml'
      - '!apps/demo-server/**'
      - '!.github/workflows/demo-server*.yml'
      - 'apps/mobile/src/protocol/types.ts'
      - 'apps/mobile/src/lib/workspace-names.ts'
      - 'apps/mobile/mock-server/fixtures/status.json'
      - 'apps/desktop/Sources/SimulatorFrames/**'
      - 'apps/desktop/Sources/EmulatorFrames/**'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/oversight-vectors.json'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/*status*.json'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/replay-range.json'
      - 'apps/desktop/Tests/VisualFixtureTests/Fixtures/real-archive/**'
  pull_request:
    paths:
      - '**'
      - '!website/docs/**'
      - '!apps/desktop/**'
      - '!.github/workflows/desktop.yml'
      - '!apps/mobile/**'
      - '!.github/workflows/mobile.yml'
      - '!apps/demo-server/**'
      - '!.github/workflows/demo-server*.yml'
      - 'apps/mobile/src/protocol/types.ts'
      - 'apps/mobile/src/lib/workspace-names.ts'
      - 'apps/mobile/mock-server/fixtures/status.json'
      - 'apps/desktop/Sources/SimulatorFrames/**'
      - 'apps/desktop/Sources/EmulatorFrames/**'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/oversight-vectors.json'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/*status*.json'
      - 'apps/desktop/Tests/StimKitTests/Fixtures/replay-range.json'
      - 'apps/desktop/Tests/VisualFixtureTests/Fixtures/real-archive/**'

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ inputs.full && '-full' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Repository builds require Node 22.18 or later because tsdown uses that
      # floor. Prove Node 22 and the current LTS line 24.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup-stim
        with:
          node: ${{ matrix.node }}
          build: 'false'

      # Lint and format are fast and fail early. oxlint and oxfmt are the oxc
      # toolchain; typecheck is the production src (tests run under vitest),
      # and it now sits below the build -- see why on that step.
      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Format check (oxfmt)
        run: pnpm run format:check

      - name: Shared RPC validators match the contract
        run: pnpm run rpc:check

      - name: Build (tsdown, all packages)
        run: pnpm run build

      - name: Hot-path closures of the built CLI
        run: node scripts/dist-closure.mjs --enforce cli,ios,android,status,status-command,agent-device,net,agent-driver

      - name: stim and stim/plugin API reports match their baselines
        run: node scripts/plugin-api-report.mjs

      - name: Committed Action bundle matches source
        id: action-bundle
        run: git diff --exit-code -- .github/actions/stim-ci/dist

      - name: Retain the generated Action bundle when stale
        if: failure() && matrix.node == 22 && steps.action-bundle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: generated-stim-ci-action
          path: .github/actions/stim-ci/dist/main.mjs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck (production)
        run: pnpm run typecheck

      # Dead-code gate: unused exports, files, and dependencies. Keeps the
      # surface honest as the codebase changes.
      - name: Dead code (knip)
        run: pnpm run knip

      - name: Unit tests (vitest)
        shell: bash
        run: |
          unit_files=()
          while IFS= read -r -d '' unit_file; do
            unit_files+=("$unit_file")
          done < <(node scripts/ci-unit-test-files.mjs)
          if ((${#unit_files[@]})); then
            pnpm run test "${unit_files[@]}" --reporter=default --reporter=json --outputFile.json=test-results/unit-${{ matrix.node }}.json
          else
            pnpm run test:unit --reporter=default --reporter=json --outputFile.json=test-results/unit-${{ matrix.node }}.json
          fi

      - name: Benchmark harness tests (vitest)
        shell: bash
        env:
          BENCH_FULL_SUITE: ${{ inputs.full || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
        run: |
          benchmark_paths=(
            scripts/agent-benchmark/
            scripts/launch-crash-benchmark.mjs
            test/e2e/native/fixtures/xcode/
            packages/stim-cli/package.json
            packages/stim-cli/src/engine/eas-machine-root-guard-env.ts
            packages/stim-cli/src/commands/gc/temp-leftovers-guard-env.ts
            package.json
            pnpm-lock.yaml
            vitest.bench.config.ts
            vitest.config.ts
            vitest.setup.ts
            vitest.global-tmpdir.ts
            vitest.reap-children.ts
            vitest.kill-run-processes.ts
            .github/workflows/ci.yml
          )
          if [[ "$BENCH_FULL_SUITE" == true ]]; then
            pnpm run test:bench
          elif git diff --quiet HEAD^1 HEAD -- "${benchmark_paths[@]}"; then
            echo "Benchmark harness unchanged; skipping test:bench"
          else
            pnpm run test:bench
          fi

      - name: Integration tests (vitest)
        if: github.event_name != 'pull_request' && (github.event_name != 'push' || matrix.node == 24)
        run: pnpm run test:integration --reporter=default --reporter=json --outputFile.json=test-results/integration-${{ matrix.node }}.json

      - name: Retain unit-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-timings-node-${{ matrix.node }}
          path: test-results/unit-${{ matrix.node }}.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain integration-test timings
        if: always() && github.event_name != 'pull_request' && (github.event_name != 'push' || matrix.node == 24)
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-timings-node-${{ matrix.node }}
          path: test-results/integration-${{ matrix.node }}.json
          if-no-files-found: ignore
          retention-days: 7

      # The fast cross-platform e2e: real git worktrees, the real CLI, the real
      # fingerprint/buildCacheKey/store/resolve cache machinery, and a real
      # single-flight race between real node processes -- throwaway STIM_HOME,
      # no Xcode, no Android SDK.
      - name: Cross-platform e2e
        run: pnpm run test:e2e

  test-windows:
    name: test (windows)
    if: inputs.full
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim

      - name: Typecheck (production)
        run: pnpm run typecheck

      - name: Windows CLI and cache smoke
        run: >-
          pnpm test
          packages/stim-cli/src/__tests__/exec.integration.test.ts
          packages/stim-cli/src/__tests__/api-reports.integration.test.ts
          packages/stim-cli/src/__tests__/report-runtime.integration.test.ts
          packages/stim-cli/src/__tests__/doctor-fingerprint.integration.test.ts
          packages/stim-cli/src/__tests__/stim-installations.test.ts
          packages/stim-cli/src/__tests__/detached-entry.test.ts
          packages/stim-cli/src/__tests__/detached-entry.integration.test.ts
          packages/stim-cli/src/__tests__/logs-command.integration.test.ts
          packages/stim-cli/src/__tests__/cache-packages.test.ts
          packages/stim-cli/src/__tests__/engine-build-lock.integration.test.ts
          packages/stim-cli/src/__tests__/metro.test.ts
          packages/stim-cli/src/__tests__/stimd-metro.integration.test.ts
          packages/stim-cli/src/__tests__/daemon-metro-stop.test.ts
          packages/stim-cli/src/__tests__/daemon-cadence.test.ts
          packages/stim-cli/src/__tests__/stimd.integration.test.ts
          packages/stim-cli/src/__tests__/daemon-idle.integration.test.ts
          packages/stim-cli/src/__tests__/daemon-ladder.test.ts
          packages/stim-cli/src/__tests__/daemon-pressure.test.ts
          packages/stim-cli/src/__tests__/daemon-probe.test.ts
          packages/stim-cli/src/__tests__/daemon-reclaim.test.ts
          packages/stim-cli/src/__tests__/daemon-status.test.ts
          packages/stim-cli/src/__tests__/disk-floor.test.ts
          packages/stim-cli/src/__tests__/maintenance-rung6.test.ts
          packages/stim-cli/src/__tests__/gc-outputs-lock.test.ts
          packages/stim-cli/src/__tests__/device-capacity.test.ts
          packages/stim-cli/src/__tests__/engine-build-slots.test.ts
          packages/stim-cli/src/__tests__/stim-home-registry.test.ts
          packages/stim-cli/src/__tests__/doctor-source.test.ts
          packages/stim-cli/src/__tests__/doctor-source-repair.integration.test.ts
          packages/stim-cli/src/__tests__/agent-device-command.integration.test.ts
          packages/server/__tests__/control-clipboard.integration.test.ts
          packages/server/__tests__/build-area-eviction.integration.test.ts

      - name: Windows startup cancellation
        run: |
          pnpm test packages/stim-cli/src/__tests__/api-start.integration.test.ts -t "cancelling startup drains dynamic Expo config"

  test-macos:
    name: test (macos)
    if: inputs.full
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim

      - name: Start CoreSimulator
        continue-on-error: true
        timeout-minutes: 5
        run: xcrun simctl list devices > /dev/null

      - name: Darwin-gated unit tests (vitest)
        shell: bash
        run: |
          unit_files=()
          while IFS= read -r -d '' unit_file; do
            unit_files+=("$unit_file")
          done < <(node scripts/ci-darwin-unit-test-files.mjs)
          pnpm run test "${unit_files[@]}" --testTimeout=60000 --reporter=default --reporter=json --outputFile.json=test-results/unit-macos.json

      - name: Benchmark harness tests (vitest)
        run: pnpm run test:bench --testTimeout=60000

      - name: Retain unit-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-timings-macos
          path: test-results/unit-macos.json
          if-no-files-found: ignore
          retention-days: 7

  native-process-inspection:
    name: native process inspection (${{ matrix.os }})
    if: inputs.full
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/setup-stim
        if: runner.os == 'macOS'
        with:
          build: 'false'
      - name: Build the Darwin process observer
        if: runner.os == 'macOS'
        run: pnpm --filter @stim-cli/core run build
      - name: Verify recorded process inspection and exit
        run: node --test test/e2e/native-processes.e2e.js
      - name: Verify Darwin unknown, reuse and cleanup gates
        if: runner.os == 'macOS'
        run: node --test test/e2e/native-cleanup.e2e.js

  runtime-floor:
    name: published runtime (node 22.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up build Node
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Set up runtime Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Verify published runtime
        run: node test/runtime-floor.mjs

      - name: Set up unsupported Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify the refusal below the runtime floor
        run: node test/runtime-refusal.mjs

  build-stage-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.build_stage_macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
      - name: Build-stage regression tests
        run: pnpm test packages/stim-cli/src/__tests__/macos.integration.test.ts packages/stim-cli/src/__tests__/ios-build.test.ts packages/stim-cli/src/__tests__/android-build.test.ts packages/ci/src/__tests__/build.test.ts
      - name: Real SwiftPM build and artifact export with a running app
        env:
          STIM_BUILD_QA_ARTIFACTS: ${{ runner.temp }}/stim-build-stage-evidence
        run: node test/e2e/native/build-api-macos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-stage-macos
          path: ${{ runner.temp }}/stim-build-stage-evidence
          if-no-files-found: warn
