# Fast, BLOCKING CI. Runs on every push and pull request.
#
# Everything provable on a plain Linux box with no Xcode and no Android SDK:
# lint, format, typecheck, build, the full vitest unit suite (all five
# packages), and the fast cross-platform e2e (test/e2e/cache-flow.e2e.js), which
# drives the real CLI and the real cache library end to end with no compiler.
# The SLOW native builds live in e2e-native.yml, gated so a flaky 15-minute
# build never blocks a PR.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Repository builds require Node 22.18 or later because tsdown uses that
      # floor. Prove Node 22 and the current LTS line 24.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
        with:
          node: ${{ matrix.node }}
          build: 'false'

      # Lint and format are fast and fail early. oxlint and oxfmt are the oxc
      # toolchain; typecheck is the production src (tests run under vitest),
      # and it now sits below the build -- see why on that step.
      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Format check (oxfmt)
        run: pnpm run format:check

      # Build every package with tsdown as ESM. Proves the published artifacts
      # compile.
      #
      # BEFORE typecheck, and that order is load-bearing. The cache packages
      # are consumed by stim-cli's suite as `@stim-cli/expo-build-cache` and
      # `@stim-cli/metro`; their declaration files are
      # build OUTPUT, so a typecheck that runs first cannot resolve either
      # module and fails with TS2307 on a tree that is perfectly fine.
      - name: Build (tsdown, all packages)
        run: pnpm run build

      - name: Typecheck (production)
        run: pnpm run typecheck

      # Dead-code gate: unused exports, files, and dependencies. Keeps the
      # surface honest as the codebase changes.
      - name: Dead code (knip)
        run: pnpm run knip

      # The unit suite on vitest (rolldown-vite): stim-cli + the cache packages,
      # 70 files. Real processes, real ports, real git; fakes for xcrun/adb.
      - name: Unit tests (vitest)
        run: pnpm test

      # The fast cross-platform e2e: real git worktrees, the real CLI, the real
      # fingerprint/buildCacheKey/store/resolve cache machinery, and a real
      # single-flight race between real node processes -- throwaway STIM_HOME,
      # no Xcode, no Android SDK.
      - name: Cross-platform e2e
        run: pnpm run test:e2e

  # BLOCKING. The unit suite on a GitHub-hosted Windows runner. Lint, format
  # and knip are platform-independent and already proven by the Linux lanes,
  # so this job only repeats what can differ on Windows: install, build,
  # typecheck and the tests themselves.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim

      - name: Typecheck (production)
        run: pnpm run typecheck

      - name: Unit tests (vitest)
        run: pnpm test

  # BLOCKING. The Android half of the dev loop on Windows, driven by the same
  # fixture and driver the macOS and Linux native lanes use, in two sizes:
  #
  #   smoke  every push and pull request. One worktree: fixture, stim start,
  #          a cold Gradle build, install and launch on an owned emulator,
  #          readiness, stim stop, worktree remove, cleanup checks. About
  #          22 minutes, dominated by the emulator boot and the cold build.
  #   loop   the full loop with the second-worktree cache proof and named
  #          slots, about 47 minutes, added on workflow_dispatch or a pull
  #          request from a branch named for Windows work.
  #
  # Both are real proof of the paths the unit suite fakes: gradlew.bat through
  # cross-spawn, Metro listener discovery through netstat, adb and the
  # emulator, and the taskkill tree kill on stop.
  #
  # The SDK, system image and acceleration facts live in
  # .github/actions/windows-android-sdk, shared with windows-debug.yml.
  #
  # The loop suite's driver step is still allowed to fail while the APK
  # assertion below it is not: the named-slots phase exits 1 after the loop has
  # passed, because a repeated slot loses device.systemImage (#892) and the
  # resulting all-ABI build overruns the NDK object-path limit (#893). Until
  # those land the assertion is that suite's gate; then the driver step becomes
  # it and the assertion goes. The smoke suite never reaches that phase, so its
  # driver step is the gate.
  windows-android-e2e:
    name: android ${{ matrix.suite }} (windows)
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.suite == 'loop' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.head_ref, 'windows'))) && '["smoke", "loop"]' || '["smoke"]') }}
    env:
      # os.tmpdir() reads TEMP on Windows, and the driver builds its fixture
      # under it. It is D:\e rather than a path inside the workspace because
      # every CMake object path is built from the fixture root and Windows caps
      # a path at 260 characters.
      TEMP: D:\e
      TMP: D:\e
    steps:
      - uses: actions/checkout@v4
      - run: New-Item -ItemType Directory -Force -Path "D:\e"
      - uses: ./.github/actions/setup-stim
      - uses: ./.github/actions/windows-android-sdk

      - name: Doctor (android)
        continue-on-error: true
        run: node packages/stim-cli/dist/cli.mjs doctor --platform android

      # --keep leaves the fixture and its worktrees on this ephemeral runner so
      # the assertion and the upload below can read them.
      - name: Android ${{ matrix.suite }} e2e (bare)
        continue-on-error: ${{ matrix.suite == 'loop' }}
        run: >-
          node test/e2e/native/run-native-e2e.mjs
          --framework bare --platform android --keep --home "D:\e\stim-home"
          ${{ matrix.suite == 'smoke' && '--smoke' || '' }}

      # The step that decides the loop suite's colour until #892 and #893 land:
      # the driver step above passes the build, install and launch, then exits 1
      # in the named-slots phase, so the artifact is the part this job can hold.
      - name: Assert Stim produced an APK
        if: matrix.suite == 'loop'
        run: |
          $apk = Get-ChildItem -Path "D:\e" -Recurse -Filter *.apk -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $apk) { throw "stim android produced no APK under the e2e temp root" }
          "stim android produced $($apk.FullName) ($([math]::Round($apk.Length / 1MB, 1)) MB)"

      - name: Upload build and device logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-android-${{ matrix.suite }}-logs
          path: D:\e\stim-home\workspaces\**\logs\*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  runtime-floor:
    name: published runtime (node 22.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up build Node
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Set up runtime Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Verify published runtime
        run: node test/runtime-floor.mjs
