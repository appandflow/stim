# Fast, BLOCKING CI. Runs on every push and pull request.
#
# Everything provable on a plain Linux box with no Xcode and no Android SDK:
# lint, format, typecheck, build, the full vitest unit suite (all five
# packages), and the fast cross-platform e2e (test/e2e/cache-flow.e2e.js), which
# drives the real CLI and the real cache library end to end with no compiler.
# The SLOW native builds live in e2e-native.yml, gated so a flaky 15-minute
# build never blocks a PR.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Repository builds require Node 22.18 or later because tsdown uses that
      # floor. Prove Node 22 and the current LTS line 24.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm and Node ${{ matrix.node }}
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile

      # Lint and format are fast and fail early. oxlint and oxfmt are the oxc
      # toolchain; typecheck is the production src (tests run under vitest),
      # and it now sits below the build -- see why on that step.
      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Format check (oxfmt)
        run: pnpm run format:check

      # Build every package with tsdown as ESM. Proves the published artifacts
      # compile.
      #
      # BEFORE typecheck, and that order is load-bearing. The cache packages
      # are consumed by stim-cli's suite as `@stim-cli/expo-build-cache` and
      # `@stim-cli/metro`; their declaration files are
      # build OUTPUT, so a typecheck that runs first cannot resolve either
      # module and fails with TS2307 on a tree that is perfectly fine.
      - name: Build (tsdown, all packages)
        run: pnpm run build

      - name: Typecheck (production)
        run: pnpm run typecheck

      # Dead-code gate: unused exports, files, and dependencies. Keeps the
      # surface honest as the codebase changes.
      - name: Dead code (knip)
        run: pnpm run knip

      # The unit suite on vitest (rolldown-vite): stim-cli + the cache packages,
      # 70 files. Real processes, real ports, real git; fakes for xcrun/adb.
      - name: Unit tests (vitest)
        run: pnpm test

      # The fast cross-platform e2e: real git worktrees, the real CLI, the real
      # fingerprint/buildCacheKey/store/resolve cache machinery, and a real
      # single-flight race between real node processes -- throwaway STIM_HOME,
      # no Xcode, no Android SDK.
      - name: Cross-platform e2e
        run: pnpm run test:e2e

  # BLOCKING. The unit suite on a GitHub-hosted Windows runner. Lint, format
  # and knip are platform-independent and already proven by the Linux lanes,
  # so this job only repeats what can differ on Windows: install, build,
  # typecheck and the tests themselves.
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build (tsdown, all packages)
        run: pnpm run build

      - name: Typecheck (production)
        run: pnpm run typecheck

      - name: Unit tests (vitest)
        run: pnpm test

  # NON-BLOCKING. The Android half of the dev loop on Windows, driven by the
  # same fixture and driver the macOS and Linux native lanes use. It runs only
  # on an explicit workflow_dispatch or on a pull request from a branch named
  # for Windows work, and stays non-blocking until #881 has it passing.
  #
  # The runner image ships the Android SDK, build-tools, platform-tools, NDK and
  # the emulator binary at ANDROID_HOME=C:\Android\android-sdk, but NO system
  # image, so one is installed below before Stim can create its own AVD.
  #
  # It DOES have VM acceleration: `emulator -accel-check` on this image answers
  # "WHPX(10.0.26100) is installed and usable", so an owned emulator can boot
  # here. That is measured, not assumed, and the check stays in the job so the
  # claim keeps being re-verified rather than trusted.
  #
  # The loop step is still allowed to fail while the APK assertion below it is
  # not. Boot, install and launch depend on an emulator that can regress with
  # the image; producing the artifact does not. The floor this job holds is that
  # Stim drives a real Gradle build to a real APK on Windows.
  windows-android-e2e:
    name: windows android e2e (non-blocking)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.head_ref, 'windows'))
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 90
    env:
      # os.tmpdir() reads TEMP on Windows, and the driver builds its fixture
      # under it. Keeping it in the workspace is what lets the APK assertion and
      # the log upload find anything.
      TEMP: ${{ github.workspace }}\e2e-tmp
      TMP: ${{ github.workspace }}\e2e-tmp
    steps:
      - uses: actions/checkout@v4
      - run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\e2e-tmp"

      - name: Set up pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build (dist/cli.mjs is what the native e2e drives)
        run: pnpm run build

      - name: Record what this runner can actually do
        continue-on-error: true
        run: |
          "ANDROID_HOME=$env:ANDROID_HOME"
          & "$env:ANDROID_HOME\emulator\emulator.exe" -accel-check
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --list_installed

      - name: Install a system image so Stim can create its own AVD
        run: |
          $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          & $sdkmanager --install "platform-tools" "system-images;android-34;google_apis;x86_64"
          "$env:ANDROID_HOME\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:ANDROID_HOME\emulator" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Doctor (android)
        continue-on-error: true
        run: node packages/stim-cli/dist/cli.mjs doctor --platform android

      # --keep leaves the fixture and its worktrees on this ephemeral runner so
      # the assertion and the upload below can read them.
      - name: Android loop e2e (bare)
        continue-on-error: true
        run: >-
          node test/e2e/native/run-native-e2e.mjs
          --framework bare --platform android --keep --home "${{ github.workspace }}\e2e-tmp\stim-home"

      # The step that decides this job's colour. Install and launch depend on an
      # emulator the runner may not be able to boot; producing the APK does not.
      - name: Assert Stim produced an APK
        run: |
          $apk = Get-ChildItem -Path "${{ github.workspace }}\e2e-tmp" -Recurse -Filter *.apk -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $apk) { throw "stim android produced no APK under the e2e temp root" }
          "stim android produced $($apk.FullName) ($([math]::Round($apk.Length / 1MB, 1)) MB)"

      - name: Upload build and device logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-android-e2e-logs
          path: ${{ github.workspace }}\e2e-tmp\stim-home\workspaces\**\logs\*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  runtime-floor:
    name: published runtime (node 22.12.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up build Node
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Set up runtime Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Verify published runtime
        run: node test/runtime-floor.mjs
