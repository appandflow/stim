name: Desktop next

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/actions/desktop-build/**'
      - '.github/workflows/desktop-next.yml'
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the head of main without waiting for the throttle. Off, or on any other ref, builds the checked-out commit as a dry run that publishes nothing.
        type: boolean
        default: false

permissions:
  contents: read

env:
  DESKTOP_NEXT_THROTTLE_MINUTES: 30
  DESKTOP_NEXT_KEEP: 5
  APPCAST_URL: https://github.com/${{ github.repository }}/releases/download/desktop-latest/appcast.xml

# GitHub keeps one run active and one pending, and a newer pending run replaces the older one, so a
# burst of merges queues at most one build. A dry run has a group of its own.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && format('desktop-next-dry-{0}', github.run_id) || 'desktop-next' }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'appandflow/stim' && vars.DESKTOP_NEXT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      engine: ${{ steps.plan.outputs.engine }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Choose between a publish and a dry run
        id: mode
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          publish=false
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ "$INPUT_PUBLISH" = true ]; }; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF publish=$publish"

      - name: Wait until DESKTOP_NEXT_THROTTLE_MINUTES after the last next build
        if: steps.mode.outputs.publish == 'true' && github.event_name != 'workflow_dispatch'
        run: |
          if ! published=$(gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("desktop-next-")) | .published_at] | max // ""'); then
            echo "::warning::could not list the releases; building without waiting"
            exit 0
          fi
          if [ -z "$published" ]; then
            echo "no next build has been published yet"
            exit 0
          fi
          wait=$(($(date -u -d "$published" +%s) + DESKTOP_NEXT_THROTTLE_MINUTES * 60 - $(date +%s)))
          echo "the last next build was published $published"
          if [ "$wait" -gt 0 ]; then
            echo "waiting ${wait}s"
            sleep "$wait"
          fi

      - name: Resolve the commit to build
        id: head
        env:
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          if [ "$PUBLISH" = true ]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
            [ -n "$sha" ] || { echo "::error::could not resolve refs/heads/main"; exit 1; }
            echo "head of main: $sha"
          else
            sha=$GITHUB_SHA
            echo "dry run of $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The main ruleset requires the merge queue's `merge gate` check, but repository admins can
      # bypass it. A bypassed push builds only once the CI release-gate jobs passed on it.
      - name: The head passed its required checks
        id: gate
        if: steps.mode.outputs.publish == 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          passed() {
            local conclusion
            conclusion=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" -f check_name="$1" \
              --jq '.check_runs | sort_by(.id) | last | .conclusion // ""')
            [ "$conclusion" = success ]
          }
          if passed 'merge gate'; then
            echo "merge gate passed on $SHA"
          elif passed 'test (node 22)' && passed 'test (node 24)' && passed 'published runtime (node 22.12.0)'; then
            echo "$SHA bypassed the merge queue; the CI release-gate jobs passed"
          else
            echo "::notice::$SHA has no passing merge gate or CI release gate yet; not building it"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.gate.outputs.skip != 'true'
        with:
          ref: ${{ steps.head.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether Desktop changed and compute the version
        id: plan
        if: steps.gate.outputs.skip != 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          paths=(apps/desktop .github/actions/desktop-build .github/workflows/desktop-next.yml)
          stable=$(git tag -l 'desktop-v*' | grep -E '^desktop-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          base=0.0.0
          if [ -n "$stable" ]; then base=${stable#desktop-v}; fi
          IFS=. read -r major minor _ <<<"$base"
          stamp=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M%S "$SHA")
          version="$major.$((minor + 1)).0-next.$stamp.g${SHA:0:7}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.0-next\.[0-9]{14}\.g[0-9a-f]{7}$ ]]; then
            echo "::error::refusing to build $version: not an X.Y.0-next.<stamp>.g<sha> version"
            exit 1
          fi
          echo "latest stable: ${stable:-none}; next version: $version"

          if [ "$PUBLISH" = true ]; then
            appcast="$RUNNER_TEMP/appcast.xml"
            : > "$appcast"
            if gh release view desktop-latest --json assets --jq '.assets[].name' 2>/dev/null | grep -qx appcast.xml; then
              gh release download desktop-latest --pattern appcast.xml --dir "$RUNNER_TEMP/appcast-download" --clobber
              mv "$RUNNER_TEMP/appcast-download/appcast.xml" "$appcast"
            fi
            served=$(node scripts/desktop-appcast.mjs list --current "$appcast")
            printf '%s\n' "$served"
            if printf '%s\n' "$served" | cut -f3 | grep -q "\.g${SHA:0:7}\$"; then
              echo "::notice::$SHA is already on the next channel; nothing to build"
              exit 0
            fi

            baseline=
            baseline_name=
            baseline_count=-1
            consider() {
              local commit count
              commit=$(git rev-parse --verify -q "$2^{commit}") || return 0
              count=$(git rev-list --count "$commit")
              if [ "$count" -gt "$baseline_count" ]; then
                baseline=$commit
                baseline_name=$1
                baseline_count=$count
              fi
            }
            if [ -n "$stable" ]; then consider "$stable" "$stable"; fi
            newest=$(printf '%s\n' "$served" | awk -F'\t' '$1 == "next" { print $2 "\t" $3 }' | sort -n | tail -1 | cut -f2)
            if [ -n "$newest" ]; then consider "$newest" "${newest##*.g}"; fi
            if [ -n "$baseline" ] && git diff --quiet "$baseline" "$SHA" -- "${paths[@]}"; then
              echo "::notice::Desktop did not change since $baseline_name ($baseline); nothing to build"
              exit 0
            fi
            if [ -n "$stable" ] && [ "$(git rev-list --count "$SHA")" -le "$(git rev-list --count "$stable")" ]; then
              echo "::notice::$SHA is not newer than $stable; nothing to build"
              exit 0
            fi
          fi
          # The app installs the engine version it embeds, so a publish waits until stim@next is built from
          # this commit or a later one; the hourly run builds it once the npm next channel catches up.
          engine=$(npm view stim@next version)
          if [[ ! "$engine" =~ \.g([0-9a-f]{7,})$ ]]; then
            echo "::error::stim@next is $engine, which names no commit"
            exit 1
          fi
          if [ "$PUBLISH" = true ] && ! git merge-base --is-ancestor "$SHA" "${BASH_REMATCH[1]}" 2>/dev/null; then
            echo "::notice::stim@next $engine is not built from $SHA or a later commit yet; not building"
            exit 0
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "building $version from $SHA with the engine $engine"

  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: macos-15
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      TAG: desktop-next-${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build, sign and notarize
        uses: ./.github/actions/desktop-build
        with:
          version: ${{ env.VERSION }}
          tag: ${{ env.TAG }}
          channel: next
          appcast-url: ${{ env.APPCAST_URL }}
          engine-version: ${{ needs.plan.outputs.engine }}
          sparkle-public-ed-key: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          sentry-dsn: ${{ vars.STIM_DESKTOP_SENTRY_DSN }}
          cert-p12-base64: ${{ secrets.DESKTOP_CERT_P12_BASE64 }}
          cert-password: ${{ secrets.DESKTOP_CERT_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.DESKTOP_PROVISIONING_PROFILE_BASE64 }}
          asc-key-p8-base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          asc-key-id: ${{ secrets.ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          sparkle-ed-private-key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          sentry-org: ${{ vars.SENTRY_ORG }}
          sentry-project: ${{ vars.SENTRY_DESKTOP_PROJECT }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stim-desktop-${{ env.VERSION }}
          path: |
            apps/desktop/build/release/Stim-*.dmg
            apps/desktop/build/release/Stim-*.zip
            apps/desktop/build/release/SHA256SUMS
            apps/desktop/build/release/appcast-item.xml
          retention-days: 7
          if-no-files-found: error

      - name: Refuse to publish a build that is not notarized
        if: env.PUBLISH == 'true'
        run: |
          if [ -z "${DESKTOP_SIGNING_IDENTITY:-}" ] || [ -z "${ASC_KEY_PATH:-}" ]; then
            echo "::error::A next build publishes only a Developer ID signed, notarized build. Set the signing and App Store Connect secrets, then re-run this job."
            exit 1
          fi
          if [ ! -f apps/desktop/build/release/appcast-item.xml ]; then
            echo "::error::A next build needs the Sparkle key to write its appcast item. Set SPARKLE_ED_PRIVATE_KEY and SPARKLE_PUBLIC_ED_KEY, then re-run this job."
            exit 1
          fi

      - name: Create the GitHub prerelease
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^desktop-next-[0-9]+\.[0-9]+\.0-next\.[0-9]{14}\.g[0-9a-f]{7}$ ]]; then
            echo "::error::refusing to publish $TAG: not a desktop-next-<version> tag"
            exit 1
          fi
          out=apps/desktop/build/release
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --prerelease --latest=false --title "Stim Desktop $VERSION" \
              --notes "A prerelease build of Stim Desktop from main at $SHA. Turn on Get prerelease updates in Settings > App > Updates to receive these builds in the app. Download \`Stim-$VERSION.dmg\`, open it and drag Stim to Applications. \`SHA256SUMS\` lists the checksums."
          fi
          gh release upload "$TAG" --clobber "$out/Stim-$VERSION.dmg" "$out/Stim-$VERSION.zip" "$out/SHA256SUMS"

      - name: Remove the signing keychain and API key
        if: always()
        run: |
          if [ -n "${DESKTOP_KEYCHAIN:-}" ]; then security delete-keychain "$DESKTOP_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/desktop-cert.p12" "$RUNNER_TEMP/desktop.provisionprofile"

  # The group desktop-appcast is shared with the stable publish job in desktop-release.yml. GitHub keeps
  # one running and one pending job per group and cancels an older pending job when a newer one queues;
  # the group holds at most this job and one stable publish job, because each workflow's own concurrency
  # group starts a run only after the previous one finished.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: desktop-appcast
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: desktop-next-${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stim-desktop-${{ env.VERSION }}
          path: ${{ runner.temp }}/release

      - name: Add the build to the next channel of the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view desktop-latest > /dev/null 2>&1; then
            echo "::error::The desktop-latest release does not exist. Publish a stable desktop-v* release first."
            exit 1
          fi
          out=$RUNNER_TEMP/release
          scripts/desktop-publish-appcast.sh "$out/appcast-item.xml" "$out/appcast.xml"

      - name: Delete old next prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("desktop-next-")) | [.published_at, .tag_name] | @tsv' \
            | sort -r | tail -n +$((DESKTOP_NEXT_KEEP + 1)) | cut -f2 > "$RUNNER_TEMP/old-next-tags"
          while read -r tag; do
            if [ "$tag" = "$TAG" ] || [[ ! "$tag" =~ ^desktop-next-[0-9]+\.[0-9]+\.0-next\.[0-9]{14}\.g[0-9a-f]{7}$ ]]; then
              continue
            fi
            gh release delete "$tag" --cleanup-tag --yes || echo "::warning::could not delete $tag"
          done < "$RUNNER_TEMP/old-next-tags"

      - name: Summarize
        run: |
          {
            echo "Published \`$VERSION\` from \`$SHA\` to the Sparkle \`next\` channel as the prerelease \`$TAG\`."
            echo
            echo "The stable appcast item, \`Stim.dmg\` and the Homebrew cask are unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
