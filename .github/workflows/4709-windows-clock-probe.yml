name: Windows clock policy probe

on:
  push:
    branches: [codex/4709-windows-clock-policy]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-stim
      - run: pnpm test scripts/unit-clock-policy.integration.test.mjs --reporter=verbose
